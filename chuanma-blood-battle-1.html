<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07120e">
<link rel="icon" href="data:,">
<title>川麻 · 血战到底</title>
<style>:root{
  --bg:#060f0c;
  --felt-1:#1e5f47;
  --felt-2:#0c3527;
  --felt-3:#08251b;
  --gold:#e8c15a;
  --gold-2:#c99b34;
  --text:#eef5f0;
  --muted:#8fb3a5;
  --line:rgba(255,255,255,.08);
  --card:rgba(11,30,24,.86);
  --vw:100vw;
  --vh:100vh;
  --tw:clamp(20px, min(calc(var(--vw) * .06), calc(var(--vh) * .09)), 52px);
  --th:calc(var(--tw) * 1.38);
  --mini-h:calc(var(--th) * .64);
  --mini-w:calc(var(--th) * .45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font-family:inherit}
h1,h2,h3{margin:0;font-weight:700}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.muted{color:var(--muted)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);
  transition:transform .12s ease,background .2s,border-color .2s;
}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#2d8a67,#1c6349);border-color:#3ba57c;color:#f2fff9;box-shadow:0 6px 18px rgba(38,140,102,.28)}
.btn.primary:hover{background:linear-gradient(180deg,#35a079,#227a5b)}
.btn.gold{background:linear-gradient(180deg,#f2d27a,#d2a43c);border-color:#ffe9a6;color:#3a2a05;box-shadow:0 6px 18px rgba(220,177,66,.24)}
.btn.gold:hover{background:linear-gradient(180deg,#ffe08a,#e0b247)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.danger{background:rgba(190,60,50,.18);border-color:rgba(220,90,80,.4);color:#ffb3ab}
.btn[disabled],.btn:disabled{opacity:.4;pointer-events:none}
.btn.big{height:50px;font-size:17px;letter-spacing:2px}
.link{color:var(--muted);font-size:12px;padding:4px 2px;border-bottom:1px dashed rgba(143,179,165,.35)}
.link:hover{color:var(--text)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:16px;color:#d8e6df;
}
.icon-btn:hover{background:rgba(0,0,0,.45)}

/* ---------- 首页 ---------- */
#home{
  background:
    radial-gradient(90% 120% at 12% 0%, rgba(50,150,110,.28), transparent 55%),
    radial-gradient(80% 80% at 100% 100%, rgba(200,155,52,.16), transparent 60%),
    linear-gradient(150deg,#0a1f18 0%,#071310 60%,#050d0a 100%);
  align-items:center;justify-content:center;padding:20px;
}
#home::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(70% 70% at 50% 45%,#000,transparent 75%);
}
.home-wrap{
  position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:34px;
  width:min(1040px,calc(var(--vw) * .96));align-items:center;
}
.brand{padding-left:6px}
.logo-mark{display:flex;gap:6px;margin-bottom:10px}
.logo-mark span{
  width:36px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#fff3d6;
  background:linear-gradient(160deg,#1d7256,#0f4936);border:1px solid rgba(232,193,90,.4);
  box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16);
}
.brand h1{font-size:clamp(32px,calc(var(--vh) * .06),52px);letter-spacing:7px;line-height:1.1;text-shadow:0 8px 30px rgba(0,0,0,.4);font-family:"Songti SC","STSong","SimSun",serif;font-weight:700}
.brand .sub{margin:8px 0 18px;color:var(--muted);font-size:13px;letter-spacing:1.5px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:#b9cec4}
.feat li{display:flex;gap:8px;align-items:flex-start}
.feat i{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:6px;flex:0 0 auto;box-shadow:0 0 8px rgba(232,193,90,.6)}
.panel{
  background:linear-gradient(180deg,rgba(16,42,33,.92),rgba(8,24,18,.94));
  border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:11px;letter-spacing:2px;color:var(--muted)}
.field input,.join-row input{
  height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);
  color:var(--text);padding:0 12px;font-size:15px;outline:none;width:100%;
}
.field input:focus,.join-row input:focus{border-color:rgba(232,193,90,.55);box-shadow:0 0 0 3px rgba(232,193,90,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.join-row{display:none;gap:8px}
.join-row.on{display:flex}
.join-row input{letter-spacing:10px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.join-row .btn{flex:0 0 84px}
.home-foot{display:flex;align-items:center;gap:14px;margin-top:2px}
.net-dot{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.net-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ecb8d;box-shadow:0 0 8px #4ecb8d}
.cfg-line{font-size:11px;color:#7f9f92;line-height:1.5}
.resume{display:none;text-align:left;font-size:12px;color:var(--gold);background:rgba(232,193,90,.07);border:1px dashed rgba(232,193,90,.3);border-radius:8px;padding:8px 10px}

/* ---------- 大厅 ---------- */
#lobby{
  align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(90% 120% at 50% 0%,#154434,#071310 70%);
}
.lobby-card{
  width:min(900px,calc(var(--vw) * .95));background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.lobby-head{display:flex;align-items:center;gap:14px}
.room-code{font-size:14px;color:var(--muted);letter-spacing:1px;margin-left:auto}
.room-code b{font-size:22px;color:var(--gold);letter-spacing:8px;margin-left:4px;font-weight:700;font-variant-numeric:tabular-nums}
.lobby-head .link{margin-left:auto}
.seats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat-card{
  background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:12px;padding:12px;
  min-height:104px;display:flex;flex-direction:column;gap:6px;justify-content:center;
}
.seat-card.me{border-color:rgba(232,193,90,.45);background:rgba(232,193,90,.06)}
.seat-card.empty{opacity:.5;align-items:center;justify-content:center;border-style:dashed}
.seat-card .who{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seat-card .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:500}
.seat-card .tag.host{background:rgba(232,193,90,.18);color:var(--gold)}
.seat-card .tag.ai{background:rgba(90,180,255,.14);color:#8ec8ff}
.seat-card .state{font-size:12px;color:var(--muted)}
.seat-card .state.ready{color:#5ed49b}
.seat-card .state .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5ed49b;margin-right:5px}
.seat-card .seat-no{font-size:10px;color:#6f9184;letter-spacing:2px}
.lobby-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.lobby-tip{font-size:12px;color:var(--muted)}
.lobby-actions{margin-left:auto;display:flex;gap:10px}
.lobby-cfg{font-size:11px;color:#7f9f92}

/* ---------- 牌桌 ---------- */
#table{background:var(--bg)}
.tbl{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(90% 80% at 50% 46%, #1e6049 0%, #113b2c 48%, #092117 78%, #06140f 100%);
}
.tbl::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
.topbar{
  position:absolute;top:0;left:0;right:0;height:44px;z-index:20;
  display:flex;align-items:center;gap:12px;padding:0 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.18));
  border-bottom:1px solid rgba(255,255,255,.05);
}
.room-chip,.round-chip{
  display:flex;align-items:center;gap:8px;font-size:12px;color:#cfe0d8;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.06);
  height:28px;padding:0 10px;border-radius:8px;white-space:nowrap;
}
.room-chip #tCode{color:var(--gold);font-weight:700;letter-spacing:2px}
.round-chip{margin-left:auto;color:var(--muted)}
.sep{width:1px;height:12px;background:rgba(255,255,255,.14)}

.board{
  position:absolute;left:50%;top:calc(50% + 10px);transform:translate(-50%,-50%);
  width:min(calc(var(--vw) * .74),900px);height:min(calc(var(--vh) * .42),290px);
  display:grid;grid-template-columns:1fr 1.42fr 1fr;grid-template-rows:1fr 1.42fr 1fr;
  gap:5px;z-index:3;pointer-events:none;
}
.river{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:2px;overflow:hidden;padding:1px}
.river.top{grid-area:1/2/2/3;align-content:flex-end}
.river.left{grid-area:2/1/3/2;align-content:center;justify-content:flex-start}
.river.right{grid-area:2/3/3/4;align-content:center;justify-content:flex-end}
.river.bottom{grid-area:3/2/4/3;align-content:flex-start}
.river.left,.river.right{max-height:100%}
.center-info{
  grid-area:2/2/3/3;border-radius:14px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.32),rgba(0,0,0,.14));
  border:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:inset 0 0 24px rgba(0,0,0,.28);
}
.center-info.acting .wall-num,.center-info.acting .wall-label,
.center-info.acting .turn-line,.center-info.acting .center-log,
.center-info.prompting .wall-num,.center-info.prompting .wall-label,
.center-info.prompting .turn-line,.center-info.prompting .center-log{display:none}
.center-info.acting,.center-info.prompting{justify-content:center;gap:3px}
.wall-num{font-size:clamp(22px,calc(var(--vh) * .044),34px);font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(232,193,90,.3)}
.wall-label{font-size:9px;letter-spacing:3px;color:#7fa495;margin-bottom:2px}
.turn-line{font-size:11px;color:#d8e8e0;text-align:center;line-height:1.35;max-width:98%;padding:0 4px}
.turn-line b{color:var(--gold);font-weight:600}
.center-log{font-size:9px;color:#7c9d90;line-height:1.4;text-align:center;max-width:96%;height:24px;overflow:hidden;padding:0 4px}

/* 麻将牌 */
.tile{
  position:relative;flex:0 0 auto;width:var(--tw);height:var(--th);border-radius:calc(var(--tw)*.13);
  background:linear-gradient(160deg,#fffdf5 0%,#f5f0e2 62%,#e9e2d0 100%);
  box-shadow:0 1px 0 #c9c2ad,0 3px 5px rgba(0,0,0,.36);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.tile::after{content:"";position:absolute;inset:2px;border-radius:inherit;border:1px solid rgba(255,255,255,.65);pointer-events:none}
.tile svg{width:84%;height:88%;display:block}
.tile.back{
  background:linear-gradient(150deg,#2f8868 0%,#1b5f48 55%,#124636 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.34);
}
.tile.back::before{
  content:"";position:absolute;inset:15%;border-radius:calc(var(--tw)*.08);
  border:1px solid rgba(255,255,255,.16);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 2px,transparent 2px 6px);
}
.tile.mini{width:var(--mini-w);height:var(--mini-h);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile.mini::after{inset:1px;border-radius:2px}
.tile.mini.last{box-shadow:0 0 0 1.5px var(--gold),0 0 10px rgba(232,193,90,.55)}
.tile.qmark{position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:#c0392b;opacity:.85;z-index:2}
.tile.sel{transform:translateY(-14px);box-shadow:0 0 0 2px var(--gold),0 10px 16px rgba(0,0,0,.45);z-index:2}
.hand-gap{width:8px;flex:0 0 auto}

/* 座位 */
.seat{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat.top{top:48px;left:50%;transform:translateX(-50%);max-width:calc(var(--vw) * .78)}
.seat.left{left:5px;top:50%;transform:translateY(-50%);width:86px}
.seat.right{right:5px;top:50%;transform:translateY(-50%);width:86px}
.seat.bottom{bottom:3px;left:50%;transform:translateX(-50%);max-width:calc(var(--vw) * .97);gap:2px}
.plate{
  display:flex;align-items:center;gap:6px;font-size:11px;color:#d6e6de;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.07);
  padding:3px 8px;border-radius:8px;white-space:nowrap;max-width:100%;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.plate .nm{font-size:12px;font-weight:600;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.plate .chips{color:#c8b06b;font-size:10px;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.plate .bg{display:flex;gap:3px}
.plate .b{font-style:normal;font-size:9px;padding:0 4px;height:14px;line-height:14px;border-radius:4px;background:rgba(255,255,255,.1);color:#b9cec4}
.plate .b.dealer{background:rgba(232,193,90,.2);color:var(--gold)}
.plate .b.hu{background:rgba(226,90,70,.22);color:#ffb0a2}
.plate .b.que{background:rgba(90,160,255,.16);color:#9ecbff}
.plate .b.off{background:rgba(255,255,255,.08);color:#95b3a6}
.plate .b.ai{background:rgba(90,180,255,.12);color:#8ec8ff}
.plate .b.think{background:rgba(232,193,90,.16);color:var(--gold)}
.plate .b.thinkleft{background:rgba(232,193,90,.10);color:#d9c17a}
.turn-sec{font-size:9px;color:#9bb5aa;font-variant-numeric:tabular-nums}
.plate.active{border-color:rgba(232,193,90,.75);background:rgba(232,193,90,.1);box-shadow:0 0 0 1px rgba(232,193,90,.35),0 0 18px rgba(232,193,90,.28)}
.seat.left .plate,.seat.right .plate{flex-direction:column;gap:2px;padding:4px 6px;max-width:84px}
.seat.left .plate .bg,.seat.right .plate .bg{justify-content:center}
.op-hand{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap}
.op-hand .tile.back{width:calc(var(--th)*.34);height:calc(var(--th)*.47);border-radius:2px}
.op-hand .tile.mini{--mini-w:calc(var(--th)*.3);--mini-h:calc(var(--th)*.44)}
.op-hand.wrap{flex-wrap:wrap;justify-content:center;gap:1px;max-width:calc(var(--vw) * .78)}
.op-hand.wrap .tile{width:calc(var(--th)*.3);height:calc(var(--th)*.42);border-radius:2px}
.seat.left .op-hand.wrap,.seat.right .op-hand.wrap{max-width:82px}
.seat.left .op-hand.wrap .tile,.seat.right .op-hand.wrap .tile{width:calc(var(--th)*.26);height:calc(var(--th)*.37)}
.tile.dim{opacity:.4}
.seat.left .op-hand,.seat.right .op-hand{flex-direction:column;gap:0}
.seat.left .op-hand .tile,.seat.right .op-hand .tile{width:calc(var(--th)*.4);height:calc(var(--th)*.16);border-radius:2px;margin-top:-3px}
.seat.left .op-hand .tile:first-child,.seat.right .op-hand .tile:first-child{margin-top:0}
.seat.left .op-hand .tile.back::before,.seat.right .op-hand .tile.back::before{inset:22%}
.melds{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:calc(var(--vw) * .96);min-height:0}
.seat.top .melds,.seat.left .melds,.seat.right .melds{max-width:96%}
.seat.left .melds,.seat.right .melds{max-width:84px;gap:2px}
.meld{display:flex;gap:1px;padding:1px;border-radius:4px;background:rgba(0,0,0,.16)}
.meld .tile{--mini-w:calc(var(--th)*.35);--mini-h:calc(var(--th)*.49)}
.meld.an{opacity:.9}
.seat.left .meld .tile,.seat.right .meld .tile{--mini-w:calc(var(--th)*.26);--mini-h:calc(var(--th)*.36);border-radius:2px}
.seat-river{display:none}
.seat.bottom{bottom:3px}
.self-plate{display:flex;align-items:center;gap:6px;font-size:11px;color:#cfe0d8;height:18px}
.self-plate .chips{color:#c8b06b;opacity:.85;font-size:10px}
.hand{display:flex;gap:2px;justify-content:center;align-items:flex-end;min-height:var(--th);max-width:calc(var(--vw) * .97);padding:0 2px;flex-wrap:nowrap}
.hand .tile{cursor:pointer}
.hand .tile:hover{filter:brightness(1.03)}
.seat.bottom .melds{min-height:calc(var(--th)*.5)}

/* 中心操作区 */
.actionbar{
  display:none;width:100%;padding:0 3px;pointer-events:auto;
  align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;row-gap:4px;
}
.actionbar.on{display:flex}
.actionbar .timer{font-size:10px;color:var(--muted);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.actionbar .timer b{color:var(--gold);font-size:12px}
.actionbar .timer.urgent b{color:#ff8d7a}
.actionbar .act-hint{font-size:10px;color:#a9c3b7;letter-spacing:0;padding:0 3px}
.act{
  height:34px;min-width:33px;padding:0 5px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:0;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .1s;
}
html.wide .act{height:36px;min-width:42px;padding:0 10px;font-size:14px}
.act:active{transform:scale(.95)}
.act.hu{background:linear-gradient(180deg,#ffd977,#e2a52f);color:#3b2703;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.act.peng{background:linear-gradient(180deg,#46b98a,#227a5b);color:#f2fff9}
.act.gang{background:linear-gradient(180deg,#5aa8e0,#2c6da8);color:#f2fbff}
.act.pass{background:rgba(255,255,255,.1);color:#c8d8d0;border:1px solid rgba(255,255,255,.12)}
.act.disc{background:linear-gradient(180deg,#f4efe0,#ded5bd);color:#22302a}
.act.think{background:rgba(232,193,90,.12);border:1px solid rgba(232,193,90,.35);color:var(--gold);font-size:11px}
.act.think em{font-style:normal;font-size:9px;opacity:.8;margin-left:2px}

/* 中心提示（定缺 / 换三张） */
.center-prompt{display:none;width:100%;pointer-events:auto;flex-direction:column;align-items:center;gap:4px}
.center-prompt.on{display:flex}
.cp-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.cp-sub{font-size:9px;color:var(--muted);text-align:center;line-height:1.2}
.cp-row{display:flex;align-items:center;justify-content:center;gap:5px;width:100%}
.cp-timer{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.que-row{display:flex;gap:5px;justify-content:center}
.que-btn{
  width:50px;height:32px;border-radius:8px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);transition:.15s;
}
.que-btn:hover{border-color:var(--gold);background:rgba(232,193,90,.12)}
.que-btn .suit{font-size:14px;font-weight:700}
.que-btn.s0 .suit{color:#ff9a8f}.que-btn.s1 .suit{color:#79d9a8}.que-btn.s2 .suit{color:#8ec3ff}
.que-btn em{font-style:normal;font-size:9px;color:var(--muted)}
.center-prompt .btn{height:26px;padding:0 10px;font-size:11px;border-radius:7px}
.swap-sel{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* toast / banner */
.toast-wrap{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:calc(var(--vw) * .9)}
.toast{
  background:rgba(4,16,12,.88);border:1px solid rgba(255,255,255,.12);color:#e8f3ed;
  font-size:12px;padding:7px 14px;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.4);
  animation:toastIn .18s ease-out;white-space:nowrap;max-width:calc(var(--vw) * .88);overflow:hidden;text-overflow:ellipsis;
}
.toast.out{opacity:0;transform:translateY(-6px);transition:.28s}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.net-banner{
  position:absolute;top:44px;left:0;right:0;z-index:45;display:none;text-align:center;
  font-size:11px;color:#2a1c05;background:linear-gradient(90deg,#e8c15a,#f0d582);padding:3px 8px;
}
.net-banner.on{display:block}
.hu-banner{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:35;
  background:radial-gradient(circle at 50% 30%,rgba(255,224,140,.98),rgba(214,158,40,.96));
  color:#3a2503;border-radius:18px;padding:14px 26px;text-align:center;
  box-shadow:0 0 0 2px rgba(255,235,180,.55),0 20px 60px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.25s;min-width:180px;
}
.hu-banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hu-banner .big{font-size:30px;font-weight:800;letter-spacing:6px;line-height:1.1}
.hu-banner .sub{font-size:12px;margin-top:3px;color:#6a4807}

/* 弹窗 */
#modalRoot{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,8,6,.62);backdrop-filter:blur(3px);padding:16px}
#modalRoot.on{display:flex}
.modal-card{
  width:min(560px,calc(var(--vw) * .94));max-height:calc(var(--vh) * .92);overflow:auto;
  background:linear-gradient(180deg,#102a21,#091b14);border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:pop .18s ease-out;
}
.modal-card h3{font-size:17px;letter-spacing:2px;margin-bottom:4px}
.modal-card .sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.modal-actions{
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  position:sticky;bottom:-20px;z-index:2;
  margin:12px -20px -20px;padding:12px 20px 16px;
  background:linear-gradient(180deg,rgba(9,27,20,0),#091b14 40%);
  border-radius:0 0 18px 18px;
}
.modal-actions .left{margin-right:auto}
.set-grid{display:block}
.set-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.set-row>span{width:72px;color:#b9cec4;flex:0 0 auto}
.set-row .hint{font-size:10px;color:#6f9184;margin-left:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.seg button{
  height:30px;padding:0 12px;border-radius:8px;font-size:12px;color:#a8c0b5;
  background:rgba(255,255,255,.05);border:1px solid transparent;
}
.seg button.on{background:rgba(232,193,90,.16);border-color:rgba(232,193,90,.5);color:var(--gold);font-weight:600}
.switch{
  margin-left:auto;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.12);position:relative;transition:.2s;
}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfdcd5;transition:.2s}
.switch.on{background:rgba(64,190,139,.55)}
.switch.on::after{left:23px;background:#eafff5}
.rules p{font-size:12px;line-height:1.75;color:#b9cec4;margin:6px 0}
.rules h4{font-size:12px;color:var(--gold);margin:12px 0 4px;letter-spacing:1px}
.rules b{color:#e8f3ed}
.result .res-head{display:flex;align-items:baseline;gap:10px}
.result .res-head span{font-size:11px;color:var(--muted)}
.res-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.res-table th{text-align:left;font-weight:500;color:var(--muted);font-size:10px;padding:6px 4px;border-bottom:1px solid var(--line);letter-spacing:1px}
.res-table td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.res-table td.num{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.res-table td.num.pos{color:#5ed49b}.res-table td.num.neg{color:#ff8d7a}
.res-table td.small{font-size:10.5px;color:#9db8ab;line-height:1.5}
.res-extra{margin-top:8px;font-size:10.5px;color:#8fa99c}
.res-chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
.res-chips b{color:var(--gold);font-size:13px;margin-left:3px;font-variant-numeric:tabular-nums}
.menu .modal-actions{flex-direction:column;align-items:stretch}
.menu .modal-actions .btn{justify-content:flex-start}

/* 窄/矮屏（按视觉尺寸，竖屏旋转后同样生效） */
html.short .board{height:min(calc(var(--vh) * .42),190px);top:calc(50% + 10px)}
html.short .seat.top{top:44px}
html.short .brand h1{font-size:34px}
html.short .panel{padding:14px;gap:9px}
html.short .panel .btn{height:40px}
html.short .feat{gap:6px;font-size:11.5px}
html.short .lobby-card{padding:12px 16px;gap:10px}
html.short .seat-card{min-height:84px;padding:9px}
html.short .set-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
html.short .set-row{padding:5px 0;font-size:12px}
html.short .set-row>span{width:56px}
html.short .seg button{height:26px;padding:0 9px;font-size:11px}
html.short .switch{width:40px;height:22px}
html.short .switch::after{width:16px;height:16px}
html.short .switch.on::after{left:21px}
html.short .modal-card{padding:14px 16px}
html.short .modal-card h3{font-size:15px}
html.short .modal-card .sub{margin-bottom:8px}
html.short .modal-actions{margin:10px -16px -14px;padding:10px 16px 12px;bottom:-14px}
html.short .rules p{font-size:11px;line-height:1.6;margin:4px 0}
html.short .rules h4{margin:7px 0 2px}
html.shorter .brand .sub{margin-bottom:10px}
html.shorter .brand h1{font-size:30px}
html.shorter .feat li:nth-child(3){display:none}
html.wide .board{width:min(calc(var(--vw) * .70),940px);height:min(calc(var(--vh) * .46),340px);top:calc(50% + 12px)}

/* ---------- 竖屏布局（主场景） ---------- */
html.portrait #home{overflow-y:auto;padding:14px}
html.portrait.short #home{justify-content:flex-start}
html.portrait .home-wrap{grid-template-columns:1fr;width:92vw;gap:14px}
html.portrait .brand{padding-left:0;text-align:center}
html.portrait .logo-mark{justify-content:center}
html.portrait .brand h1{font-size:38px;letter-spacing:8px}
html.portrait .brand .sub{margin:6px 0 10px}
html.portrait .feat{font-size:11px;gap:5px;max-width:86vw;margin:0 auto}
html.portrait .panel{width:100%;padding:16px;gap:10px}
html.portrait .lobby-card{width:94vw;padding:14px}
html.portrait .lobby-head{flex-wrap:wrap;row-gap:6px}
html.portrait .seats-grid{grid-template-columns:1fr 1fr}
html.portrait .seat-card{min-height:82px;padding:9px}
html.portrait .modal-card{width:94vw}

html.portrait .topbar{height:42px;padding:0 8px;gap:8px}
html.portrait .room-chip,html.portrait .round-chip{height:26px;font-size:11px;padding:0 8px}
html.portrait .seat.top{top:42px;left:0;right:0;width:100%;max-width:none;transform:none;padding:0 4px;gap:1px}
html.portrait .seat.top .plate{max-width:calc(100vw - 8px)}
html.portrait .seat.top .op-hand{max-width:100%;gap:1px}
html.portrait .seat.top .op-hand .tile.back{width:calc(var(--tw) * .82);height:calc(var(--th) * .88);border-radius:3px}
html.portrait .seat.top .op-hand .tile.mini{--mini-w:calc(var(--tw) * .72);--mini-h:calc(var(--th) * .82)}
html.portrait .seat.top .melds{gap:2px}
html.portrait .seat.top .melds .tile{--mini-w:calc(var(--tw) * .5);--mini-h:calc(var(--th) * .62)}

html.portrait .board{
  left:70px;right:70px;top:126px;bottom:84px;width:auto;height:auto;transform:none;
  grid-template-columns:1fr;grid-template-rows:auto minmax(110px,1fr) auto;gap:4px;
}
html.portrait .river.top{grid-area:1/1/2/2;max-height:68px;align-content:flex-end}
html.portrait .river.bottom{grid-area:3/1/4/2;max-height:68px;align-content:flex-start}
html.portrait .river.left,html.portrait .river.right{display:none}
html.portrait .center-info{grid-area:2/1/3/2;width:100%;max-width:280px;height:auto;min-height:150px;max-height:240px;justify-self:center;align-self:center;padding:10px 8px}
html.portrait .center-info.acting,html.portrait .center-info.prompting{min-height:84px;max-height:120px}
html.portrait .river .tile.mini{width:calc(var(--tw) * .78);height:calc(var(--th) * .82)}
html.portrait .actionbar{gap:4px}
html.portrait .actionbar .timer{min-width:24px}

html.portrait .seat.left,html.portrait .seat.right{top:126px;bottom:84px;width:66px;transform:none;justify-content:flex-start;gap:2px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.12));border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:3px 2px}
html.portrait .seat.left{left:2px}
html.portrait .seat.right{right:2px}
html.portrait .seat.left .plate,html.portrait .seat.right .plate{width:100%;max-width:66px;padding:3px 2px;gap:1px;font-size:9px;white-space:normal}
html.portrait .seat.left .plate .bg,html.portrait .seat.right .plate .bg{flex-wrap:wrap;justify-content:center}
html.portrait .seat.left .plate .nm,html.portrait .seat.right .plate .nm{font-size:10px;max-width:62px}
html.portrait .seat.left .plate .chips,html.portrait .seat.right .plate .chips{font-size:9px}
html.portrait .seat.left .plate .b,html.portrait .seat.right .plate .b{font-size:8px;height:12px;line-height:12px;padding:0 3px}
html.portrait .seat.left .op-hand,html.portrait .seat.right .op-hand{width:100%;max-width:66px;flex-direction:column;gap:0}
html.portrait .seat.left .op-hand .tile,html.portrait .seat.right .op-hand .tile{width:calc(var(--tw) * 1.2);height:calc(var(--th) * .4);margin-top:-3px;border-radius:2px}
html.portrait .seat.left .op-hand .tile:first-child,html.portrait .seat.right .op-hand .tile:first-child{margin-top:0}
html.portrait .seat.left .melds,html.portrait .seat.right .melds{flex-direction:column;max-width:66px;width:100%;gap:1px}
html.portrait .seat.left .meld,html.portrait .seat.right .meld{width:100%;justify-content:center}
html.portrait .seat.left .meld .tile,html.portrait .seat.right .meld .tile{--mini-w:calc(var(--tw) * .4);--mini-h:calc(var(--th) * .54)}
html.portrait .seat-river{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:100%;flex:1;min-height:0;align-content:flex-end;overflow:hidden;justify-items:center;padding:2px 0}
html.portrait .seat-river .tile{width:calc(var(--tw) * .7);height:calc(var(--th) * .82)}
html.portrait .seat.left .op-hand.wrap,html.portrait .seat.right .op-hand.wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:66px}
html.portrait .seat.left .op-hand.wrap .tile,html.portrait .seat.right .op-hand.wrap .tile{width:auto;height:calc(var(--th) * .38);margin-top:0}

html.portrait .seat.bottom{left:0;right:0;width:100%;max-width:none;bottom:2px;transform:none;padding:0 2px;gap:1px}
html.portrait .self-plate{height:16px;font-size:10px;gap:4px}
html.portrait .seat.bottom .melds{gap:2px;min-height:calc(var(--th) * .5)}
html.portrait .seat.bottom .meld .tile{--mini-w:calc(var(--tw) * .52);--mini-h:calc(var(--th) * .66)}
html.portrait .hand{gap:1px;max-width:100vw;min-height:var(--th)}
html.portrait .hand .tile.sel{transform:translateY(-10px)}
html.portrait .toast-wrap{top:6px}
html.short .center-log{display:none}

/* ================= 竖屏单布局重构 ================= */
html,body{background:#040a08}
#stage{
  left:50%;top:50%;width:520px;height:100%;
  transform:translate(-50%,-50%);
  border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);
}
.screen{position:absolute;inset:0}
#modalRoot{position:absolute;inset:0}
.toast-wrap{position:absolute}

#table .tbl{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ---- 上方 3/4 常驻牌桌 ---- */
#table .table-main{
  position:relative;flex:0 0 75%;min-height:0;display:flex;flex-direction:column;
  padding:0 4px 1px;z-index:2;
}
#table .topbar{
  position:relative;flex:0 0 40px;height:40px;width:100%;padding:0 6px;gap:6px;
  border-bottom:1px solid rgba(255,255,255,.06);border-radius:0;
}
#table .room-chip,#table .round-chip{height:26px;font-size:11px;padding:0 7px;gap:6px}
#table .round-chip{margin-left:auto}
#table .snd-btn{margin-left:0;font-size:12px;font-weight:700;color:#d8e6df}
#table .snd-btn.off{opacity:.45;text-decoration:line-through}

#table .seat{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:2px}
#table .seat.top{
  flex:0 0 auto;left:auto;top:auto;transform:none;width:100%;max-width:none;
  padding:3px 2px 1px;
}
#table .seat.top .plate{max-width:calc(100% - 8px)}
#table .seat.top .op-hand{max-width:100%;gap:1px}
#table .seat.top .op-hand .tile.back{width:calc(var(--tw)*.7);height:calc(var(--th)*.76)}
#table .seat.top .melds{max-width:100%;gap:2px}
#table .seat.top .melds .tile{--mini-w:calc(var(--tw)*.42);--mini-h:calc(var(--th)*.55)}

#table .mid{flex:1 1 auto;min-height:0;display:flex;gap:3px;width:100%;padding:1px 0}
#table .board{
  position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none;flex:1 1 auto;min-width:0;min-height:0;
  width:auto;height:auto;display:grid;grid-template-columns:1fr;
  grid-template-rows:auto minmax(0,1fr) auto;gap:2px;
}
#table .river.left,#table .river.right{display:none}
#table .river.top,#table .river.bottom{
  display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:1px;
  padding:1px 2px;overflow:hidden;min-height:0;
}
#table .river.top{align-content:flex-end;height:calc(var(--th)*.62)}
#table .river.bottom{height:calc(var(--th)*.62)}
#table .river .tile.mini{width:var(--rvw,20px);height:var(--rvh,27px);border-radius:2px}
#table .center-info{
  grid-area:auto;width:min(100%,290px);max-width:none;height:auto;min-height:0;max-height:none;
  margin:0 auto;align-self:center;justify-self:center;padding:4px 8px;gap:0;
  border-radius:12px;overflow:hidden;
}
#table .wall-num{font-size:clamp(20px,calc(var(--vh)*.04),30px)}
#table .wall-label{font-size:8px;margin-bottom:1px}
#table .turn-line{font-size:10.5px;line-height:1.3}
#table .center-log{font-size:8.5px;height:22px;line-height:1.35}

/* 左右两侧玩家：竖向排列 */
#table .seat.left,#table .seat.right{
  position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none;
  flex:0 0 68px;width:68px;min-height:0;justify-content:flex-start;gap:1px;
  padding:2px 1px;overflow:hidden;border-radius:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.16));
  border:1px solid rgba(255,255,255,.05);
}
#table .seat.left .plate,#table .seat.right .plate{
  flex-direction:column;width:100%;max-width:64px;padding:2px 1px;gap:1px;
  font-size:9px;white-space:normal;
}
#table .seat.left .plate .nm,#table .seat.right .plate .nm{font-size:10px;max-width:60px;line-height:1.1}
#table .seat.left .plate .chips,#table .seat.right .plate .chips{font-size:9px;color:var(--gold);opacity:.95}
#table .seat.left .plate .bg,#table .seat.right .plate .bg{flex-wrap:wrap;justify-content:center;gap:1px}
#table .seat.left .plate .b,#table .seat.right .plate .b{font-size:8px;height:11px;line-height:11px;padding:0 2px}
#table .seat.left .op-hand,#table .seat.right .op-hand{
  width:100%;max-width:64px;flex-direction:column;gap:0;align-items:center;flex:0 0 auto;
}
#table .seat.left .op-hand .tile,#table .seat.right .op-hand .tile{
  width:32px;height:11px;margin-top:-4px;border-radius:2px;
}
#table .seat.left .op-hand .tile:first-child,#table .seat.right .op-hand .tile:first-child{margin-top:0}
#table .seat.left .op-hand .tile.back::before,#table .seat.right .op-hand .tile.back::before{inset:18%}
#table .seat.left .melds,#table .seat.right .melds{
  flex:0 0 auto;flex-direction:column;width:100%;max-width:64px;gap:1px;align-items:center;
  max-height:34%;overflow:hidden;
}
#table .seat.left .meld,#table .seat.right .meld{width:auto;max-width:64px;justify-content:center}
#table .seat.left .meld .tile,#table .seat.right .meld .tile{--mini-w:calc(var(--tw)*.3);--mini-h:calc(var(--th)*.4)}
#table .seat-river{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;flex:1 1 auto;
  min-height:0;align-content:flex-start;justify-items:center;overflow:hidden;padding:1px 0;
}
#table .seat-river .tile{width:var(--rvw,15px);height:var(--rvh,20px);border-radius:2px}
#table .seat.left .op-hand.wrap,#table .seat.right .op-hand.wrap{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:64px;
}
#table .seat.left .op-hand.wrap .tile,#table .seat.right .op-hand.wrap .tile{
  width:auto;height:calc(var(--th)*.3);margin-top:0;
}

/* 自己：碰杠在上，两行大手牌 + 右侧出牌键 */
#table .seat.bottom{
  position:relative;left:auto;right:auto;bottom:auto;transform:none;
  flex:0 0 auto;width:100%;max-width:none;padding:0;gap:1px;
}
#table .self-plate{height:auto;min-height:16px;font-size:10px;gap:5px}
#table .self-plate .chips{font-size:10px;color:var(--gold);opacity:1}
#table .seat.bottom .melds{
  flex:0 0 auto;gap:3px;justify-content:center;flex-wrap:nowrap;width:100%;
  min-height:0;max-height:calc(var(--th)*.52);overflow:hidden;
}
#table .seat.bottom .meld .tile{--mini-w:calc(var(--tw)*.34);--mini-h:calc(var(--th)*.47)}
#table .hand-zone{display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%;padding:1px 1px 2px}
#table .hand{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:flex-start;
  gap:2px;width:calc(7 * var(--tw) + 12px);max-width:calc(7 * var(--tw) + 12px);
  min-height:calc(2 * var(--th) + 2px);max-height:calc(2 * var(--th) + 2px);
  padding:0;overflow:visible;
}
#table .hand .tile{width:var(--tw);height:var(--th);cursor:pointer}
#table .hand .tile:hover{filter:brightness(1.04)}
#table .hand .tile.sel{
  transform:none;z-index:3;
  box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(232,193,90,.6);
  filter:brightness(1.06);
}
#table .hand-gap{width:6px;flex:0 0 auto}
#table .discard-btn{
  flex:0 0 58px;height:calc(var(--th)*1.12);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;letter-spacing:1px;color:#4a3303;

</style>

<body>

<script>/* 川麻规则引擎：牌、胡牌判定、番型、对局流程（血战到底 / 血流成河） */
(function (global) {
  'use strict';

  let UID = 1;
  const SUITS = ['万', '条', '筒'];
  const SUIT_COLORS = ['#b3261e', '#17864a', '#1e63c8'];
  const suitOf = t => Math.floor(t / 9);
  const rankOf = t => (t % 9) + 1;
  const tileName = t => rankOf(t) + SUITS[suitOf(t)];
  const isQueTile = (t, que) => que != null && suitOf(t) === que;

  function tile(t) { return { t: t, uid: UID++ }; }
  function copyTile(x) { return { t: x.t, uid: x.uid }; }
  function fullWall() {
    const a = [];
    for (let t = 0; t < 27; t++) for (let k = 0; k < 4; k++) a.push(tile(t));
    return a;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function countsOf(tiles) {
    const c = new Array(27).fill(0);
    for (let i = 0; i < tiles.length; i++) c[tiles[i].t]++;
    return c;
  }
  function sortTiles(a) {
    return a.sort((x, y) => (x.t - y.t) || (x.uid - y.uid));
  }
  function meldSize(m) { return m.kind === 'peng' ? 3 : 4; }
  function meldTiles(m) {
    const out = [];
    for (let i = 0; i < meldSize(m); i++) out.push(m.tiles[i]);
    return out;
  }
  function allTilesOf(p) {
    const out = p.hand.slice();
    for (const m of p.melds) for (const t of m.tiles) out.push(t);
    return out;
  }
  function hasQue(p) {
    if (p.que == null) return false;
    return p.hand.some(x => suitOf(x.t) === p.que);
  }

  /* ---------------- 胡牌判定 ---------------- */

  function trySets(counts, need) {
    if (need === 0) return true;
    let i = -1;
    for (let k = 0; k < 27; k++) if (counts[k] > 0) { i = k; break; }
    if (i < 0) return false;
    if (counts[i] >= 3) {
      counts[i] -= 3;
      if (trySets(counts, need - 1)) { counts[i] += 3; return true; }
      counts[i] += 3;
    }
    const r = i % 9;
    if (r <= 6 && counts[i + 1] > 0 && counts[i + 2] > 0) {
      counts[i]--; counts[i + 1]--; counts[i + 2]--;
      if (trySets(counts, need - 1)) { counts[i]++; counts[i + 1]++; counts[i + 2]++; return true; }
      counts[i]++; counts[i + 1]++; counts[i + 2]++;
    }
    return false;
  }

  function trySetsAllTriplets(counts, need) {
    if (need === 0) return true;
    let i = -1;
    for (let k = 0; k < 27; k++) if (counts[k] > 0) { i = k; break; }
    if (i < 0) return false;
    if (counts[i] < 3) return false;
    counts[i] -= 3;
    const ok = trySetsAllTriplets(counts, need - 1);
    counts[i] += 3;
    return ok;
  }

  function pairChoice(counts, need, tripletOnly) {
    for (let i = 0; i < 27; i++) {
      if (counts[i] >= 2) {
        counts[i] -= 2;
        const ok = tripletOnly ? trySetsAllTriplets(counts, need) : trySets(counts, need);
        counts[i] += 2;
        if (ok) return true;
      }
    }
    return false;
  }

  /* 分析胡牌：concealed 含胡牌张，melds 为已亮出副露 */
  function analyzeWin(concealed, melds) {
    const meldCount = melds.length;
    if (concealed.length !== 3 * (4 - meldCount) + 2) return { ok: false };
    const counts = countsOf(concealed);
    let sevenPairs = false, hasQuad = false, allTriplets = false;
    if (meldCount === 0 && concealed.length === 14) {
      let even = true;
      for (let i = 0; i < 27; i++) {
        if (counts[i] % 2 !== 0) { even = false; break; }
        if (counts[i] === 4) hasQuad = true;
      }
      sevenPairs = even;
    }
    if (!sevenPairs) {
      const need = 4 - meldCount;
      const normal = pairChoice(counts.slice(), need, false);
      if (!normal) return { ok: false };
      allTriplets = pairChoice(counts.slice(), need, true);
    }
    const all = concealed.slice();
    for (const m of melds) for (const x of m.tiles) all.push(x);
    const allCounts = countsOf(all);
    let roots = 0;
    if (!sevenPairs) for (let i = 0; i < 27; i++) if (allCounts[i] === 4) roots++;
    let oneSuit = true;
    const s0 = suitOf(all[0].t);
    for (const x of all) if (suitOf(x.t) !== s0) { oneSuit = false; break; }
    return {
      ok: true, sevenPairs, hasQuad, allTriplets, roots,
      oneSuit, jinGouDiao: meldCount === 4
    };
  }

  /* 番型计算（flags 为情境番） */
  function scoreHand(concealed, melds, flags, cfg) {
    const a = analyzeWin(concealed, melds);
    if (!a.ok) return { ok: false };
    const list = [];
    let fan = 0;
    if (a.sevenPairs) {
      fan += 2; list.push({ name: '七对', fan: 2 });
      if (a.hasQuad) { fan += 1; list.push({ name: '龙七对', fan: 1 }); }
    } else {
      if (a.allTriplets) { fan += 1; list.push({ name: '对对胡', fan: 1 }); }
      else list.push({ name: '平胡', fan: 0 });
      if (a.jinGouDiao) { fan += 2; list.push({ name: '金钩钓', fan: 2 }); }
    }
    if (a.oneSuit) { fan += 2; list.push({ name: '清一色', fan: 2 }); }
    if (a.roots > 0 && !a.sevenPairs) {
      fan += a.roots; list.push({ name: '根×' + a.roots, fan: a.roots });
    }
    const extra = [
      ['杠上花', flags && flags.gangFlower, 1],
      ['杠上炮', flags && flags.gangPao, 1],
      ['抢杠胡', flags && flags.qiangGang, 1],
      ['海底捞月', flags && flags.haidi, 1],
      ['天胡', flags && flags.tianHu, 2],
      ['地胡', flags && flags.diHu, 2]
    ];
    for (const e of extra) if (e[1]) { fan += e[2]; list.push({ name: e[0], fan: e[2] }); }
    const cap = cfg.cap;
    const eff = Math.min(fan, cap);
    const score = cfg.base * Math.pow(2, eff);
    return { ok: true, fan, fanEff: eff, score, patterns: list, analysis: a };
  }

  /* 向听数（含七对），用于 AI 决策 */
  const _shCache = new Map();
  function searchShape(c, need, memo) {
    let i = 0;
    while (i < 27 && c[i] === 0) i++;
    if (i >= 27 || need <= 0) return 0;
    const key = c.join('') + '|' + need;
    if (memo.has(key)) return memo.get(key);
    let best;
    c[i]--;
    best = searchShape(c, need, memo);
    c[i]++;
    if (c[i] >= 3) {
      c[i] -= 3;
      const v = 2 + searchShape(c, need - 1, memo);
      c[i] += 3;
      if (v > best) best = v;
    }
    const r = i % 9;
    if (r <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      const v = 2 + searchShape(c, need - 1, memo);
      c[i]++; c[i + 1]++; c[i + 2]++;
      if (v > best) best = v;
    }
    if (c[i] >= 2 && need >= 1) {
      c[i] -= 2;
      const v = 1 + searchShape(c, need - 1, memo);
      c[i] += 2;
      if (v > best) best = v;
    }
    if (r <= 7 && c[i + 1] > 0 && need >= 1) {
      c[i]--; c[i + 1]--;
      const v = 1 + searchShape(c, need - 1, memo);
      c[i]++; c[i + 1]++;
      if (v > best) best = v;
    }
    if (r <= 6 && c[i + 2] > 0 && need >= 1) {
      c[i]--; c[i + 2]--;
      const v = 1 + searchShape(c, need - 1, memo);
      c[i]++; c[i + 2]++;
      if (v > best) best = v;
    }
    memo.set(key, best);
    return best;
  }

  function shantenOf(counts, meldCount) {
    const key = counts.join(',') + '|' + meldCount + '|' + counts.reduce((a, b) => a + b, 0);
    if (_shCache.has(key)) return _shCache.get(key);
    const need = 4 - meldCount;
    let best = 8;
    const memo = new Map();
    let pairs = 0;
    for (let i = 0; i < 27; i++) if (counts[i] >= 2) pairs += Math.floor(counts[i] / 2);
    if (meldCount === 0) best = Math.min(best, 6 - pairs);
    for (let i = 0; i < 27; i++) {
      if (counts[i] >= 2) {
        counts[i] -= 2;
        const v = 8 - 2 * meldCount - 1 - searchShape(counts, need, memo);
        counts[i] += 2;
        if (v < best) best = v;
      }
    }
    const v = 8 - 2 * meldCount - searchShape(counts, need, memo);
    if (v < best) best = v;
    if (_shCache.size > 200000) _shCache.clear();
    _shCache.set(key, best);
    return best;
  }

  function shanten(hand, melds) {
    const c = countsOf(hand.map ? hand : []);
    return shantenOf(c, melds.length);
  }

  /* 听牌检测：返回听牌张与最大番 */
  function tingInfo(p, cfg) {
    if (hasQue(p)) return { ting: false, waits: [], maxFan: 0 };
    const countsUsed = countsOf(allTilesOf(p));
    const waits = [];
    let maxFan = 0;
    const need = 3 * (4 - p.melds.length) + 2;
    if (p.hand.length + 1 !== need) return { ting: false, waits: [], maxFan: 0 };
    for (let t = 0; t < 27; t++) {
      if (p.que != null && suitOf(t) === p.que) continue;
      if (countsUsed[t] >= 4) continue;
      const sc = scoreHand(p.hand.concat([{ t: t, uid: 0 }]), p.melds, null, cfg);
      if (sc.ok) { waits.push(t); if (sc.fan > maxFan) maxFan = sc.fan; }
    }
    return { ting: waits.length > 0, waits, maxFan };
  }

  /* ---------------- 胡牌/操作选项 ---------------- */

  function canPengWith(p, tileT) {
    if (p.que != null && suitOf(tileT) === p.que) return false;
    return p.hand.filter(x => x.t === tileT).length >= 2;
  }
  function canGangWith(p, tileT) {
    if (p.que != null && suitOf(tileT) === p.que) return false;
    return p.hand.filter(x => x.t === tileT).length >= 3;
  }
  function anGangOptions(p) {
    const c = countsOf(p.hand);
    const out = [];
    for (let t = 0; t < 27; t++) {
      if (c[t] === 4 && !(p.que != null && suitOf(t) === p.que)) out.push(t);
    }
    return out;
  }
  function buGangOptions(p) {
    const out = [];
    for (const m of p.melds) {
      if (m.kind === 'peng' && p.hand.some(x => x.t === m.t)) {
        if (!(p.que != null && suitOf(m.t) === p.que)) out.push(m.t);
      }
    }
    return out;
  }

  /* ---------------- 对局 ---------------- */

  class Game {
    constructor(cfg, names, opts) {
      opts = opts || {};
      this.cfg = Object.assign({
        mode: 'xuezhan', base: 1, cap: 5, chips: 1000,
        huan: false, chaHuaZhu: true, chaDaJiao: true, multiHu: true,
        turnMs: 20000, claimMs: 8000, queMs: 20000, swapMs: 20000
      }, cfg || {});
      this.fast = !!opts.fast;
      this.players = names.map((n, i) => ({
        seat: i, name: n || ('玩家' + (i + 1)), chips: this.cfg.chips,
        hand: [], melds: [], discards: [], que: null, hued: false,
        huInfo: [], swapped: false, swapSel: [], isAI: false, auto: false,
        online: true, tick: 0, thinkLeft: 3
      }));
      this.handNo = 0;
      this.dealer = opts.dealer == null ? Math.floor(Math.random() * 4) : opts.dealer;
      this.phase = 'idle';
      this.wall = []; this.drawIdx = 0; this.tailIdx = -1;
      this.current = -1; this.drawn = null;
      this.claim = null; this.lastDiscard = null; this.lastAction = null;
      this.swapDir = 1; this.pendingGang = null;
      this.selfHuLock = -1;
      this.result = null;
      this.log = [];
      this.seq = 0;
      this.discardCount = 0;
      this.actionGuard = 0;
      this.started = false;
      this.lastGangSeat = -1;
      this.stall = 0;
    }

    logEvent(s) {
      this.log.push(s);
      if (this.log.length > 60) this.log.shift();
    }

    activeForPlay(p) {
      return this.cfg.mode === 'xueliu' ? true : !p.hued;
    }

    nextActiveSeat(from) {
      for (let k = 1; k <= 4; k++) {
        const s = (from + k) % 4;
        if (this.activeForPlay(this.players[s])) return s;
      }
      return -1;
    }

    activeSeats() {
      return this.players.filter(p => this.activeForPlay(p)).map(p => p.seat);
    }

    startHand() {
      this.handNo++;
      this.startChips = this.players.map(p => p.chips);
      this.wall = shuffle(fullWall());
      this.drawIdx = 0; this.tailIdx = 107;
      this.phase = 'swap';
      this.claim = null; this.pendingGang = null; this.lastDiscard = null;
      this.lastAction = null; this.result = null; this.drawn = null;
      this.current = -1; this.selfHuLock = -1;
      this.discardCount = 0; this.lastGangSeat = -1; this.stall = 0;
      this.turnStartAt = 0; this.turnThinkUsed = false; this.longThinkSeat = -1;
      this.log = this.log.slice(-3);
      for (const p of this.players) {
        p.hand = []; p.melds = []; p.discards = []; p.que = null;
        p.hued = false; p.huInfo = []; p.swapped = false; p.swapSel = []; p.tick = 0;
        p.thinkLeft = 3;
      }
      for (let round = 0; round < 13; round++) {
        for (let s = 0; s < 4; s++) this.players[s].hand.push(this.wall[this.drawIdx++]);
      }
      for (const p of this.players) sortTiles(p.hand);
      this.swapDir = [1, 3, 2][Math.floor(Math.random() * 3)];
      if (this.cfg.huan) {
        this.phase = 'swap';
        this.phaseDeadline = Date.now() + (this.fast ? 0 : this.cfg.swapMs);
      } else {
        this.beginQue();
      }
      this.logEvent('第 ' + this.handNo + ' 局开始，' + this.players[this.dealer].name + ' 坐庄');
      this.seq++;
      return this;
    }

    beginQue() {
      this.phase = 'que';
      this.phaseDeadline = Date.now() + (this.fast ? 0 : this.cfg.queMs);
      this.players.forEach(p => { p.que = null; });
    }

    /* 换三张：同一花色三张，按方向传递 */
    submitSwap(seat, uids) {
      if (this.phase !== 'swap') return { ok: false, msg: '当前不能换牌' };
      const p = this.players[seat];
      if (p.swapped) return { ok: false, msg: '已换牌' };
      const tiles = [];
      for (const uid of (uids || [])) {
        const t = p.hand.find(x => x.uid === uid);
        if (!t) return { ok: false, msg: '手牌不存在' };
        tiles.push(t);
      }
      if (tiles.length !== 3) return { ok: false, msg: '请选择三张牌' };
      const s = suitOf(tiles[0].t);
      if (!tiles.every(x => suitOf(x.t) === s)) return { ok: false, msg: '三张需同一花色' };
      p.swapSel = tiles.map(x => x.uid);
      p.swapped = true;
      if (this.players.every(q => q.swapped)) this.doSwap();
      return { ok: true };
    }

    doSwap() {
      const picked = this.players.map(p => p.swapSel.map(uid => p.hand.find(x => x.uid === uid)));
      for (let s = 0; s < 4; s++) {
        const from = (s - this.swapDir + 4) % 4;
        const give = picked[s];
        const p = this.players[s];
        for (const t of give) {
          const idx = p.hand.findIndex(x => x.uid === t.uid);
          if (idx >= 0) p.hand.splice(idx, 1);
        }
        for (const t of picked[from]) p.hand.push(copyTile(t));
        sortTiles(p.hand);
      }
      const dirTxt = this.swapDir === 1 ? '逆时针' : (this.swapDir === 3 ? '顺时针' : '对家');
      this.logEvent('换三张完成（' + dirTxt + '）');
      for (const p of this.players) p.swapSel = [];
      this.beginQue();
      this.seq++;
    }

    submitQue(seat, s) {
      if (this.phase !== 'que') return { ok: false, msg: '当前不能定缺' };
      if (s < 0 || s > 2) return { ok: false, msg: '花色无效' };
      const p = this.players[seat];
      if (p.que != null) return { ok: false, msg: '已定缺' };
      p.que = s;
      this.logEvent(p.name + ' 定缺 ' + SUITS[s]);
      if (this.players.every(q => q.que != null)) this.startPlay();
      this.seq++;
      return { ok: true };
    }

    startPlay() {
      this.phase = 'play';
      this.current = this.dealer;
      this.drawn = null;
      this.beginTurn(this.dealer, true);
      this.seq++;
    }

    beginTurn(seat, draw) {
      const p = this.players[seat];
      this.current = seat;
      this.claim = null;
      this.pendingGang = null;
      this.selfHuLock = -1;
      this.drawn = null;
      if (draw) {
        const t = this.drawTile();
        if (!t) { this.endHand('牌墙摸完'); return; }
        p.hand.push(t);
        sortTiles(p.hand);
        this.drawn = t;
        this.lastAction = { type: 'draw', seat: seat, tile: t };
      }
      this.startTurnClock();
      this.seq++;
    }

    startTurnClock() {
      const now = Date.now();
      this.turnStartAt = now;
      this.turnThinkUsed = false;
      this.longThinkSeat = -1;
      this.turnDeadline = now + (this.fast ? 0 : this.cfg.turnMs);
      this.aiAt = now + (this.fast ? 0 : 350 + Math.random() * 600);
    }

    longThink(seat) {
      if (this.phase !== 'play' || this.current !== seat || this.claim) return false;
      const p = this.players[seat];
      if (!p || this.turnThinkUsed || p.thinkLeft <= 0) return false;
      const target = (this.turnStartAt || Date.now()) + 60000;
      if (target <= (this.turnDeadline || 0)) return false;
      p.thinkLeft--;
      this.turnThinkUsed = true;
      this.longThinkSeat = seat;
      this.turnDeadline = target;
      this.lastAction = { type: 'think', seat: seat };
      this.logEvent(p.name + ' 长考（剩 ' + p.thinkLeft + ' 次）');
      this.seq++;
      return true;
    }

    drawTile() {
      if (this.drawIdx > this.tailIdx) return null;
      return this.wall[this.drawIdx++];
    }

    drawTail() {
      if (this.drawIdx > this.tailIdx) return null;
      return this.wall[this.tailIdx--];
    }

    wallLeft() { return Math.max(0, this.tailIdx - this.drawIdx + 1); }

    /* 出牌 */
    discard(seat, uid) {
      if (this.phase !== 'play' || this.current !== seat) return { ok: false, msg: '还没轮到你' };
      if (this.claim) return { ok: false, msg: '等待其他玩家响应' };
      const p = this.players[seat];
      const minRest = 13 - 3 * p.melds.length;
      if (p.hand.length - 1 < minRest) return { ok: false, msg: '手牌数异常' };
      if (this.selfHuLock === seat) this.selfHuLock = -1;
      const idx = p.hand.findIndex(x => x.uid === uid);
      if (idx < 0) return { ok: false, msg: '手牌不存在' };
      const t = p.hand.splice(idx, 1)[0];
      p.discards.push(t);
      this.drawn = null;
      this.longThinkSeat = -1;
      this.discardCount++;
      this.lastDiscard = {
        seat: seat, tile: t, afterGang: this.lastGangSeat === seat,
        haidi: this.wallLeft() === 0
      };
      this.lastAction = { type: 'discard', seat: seat, tile: t };
      this.logEvent(p.name + ' 打出 ' + tileName(t.t));
      this.lastGangSeat = -1;
      this.openClaims(seat, t);
      this.seq++;
      return { ok: true };
    }

    openClaims(fromSeat, t) {
      const options = {};
      for (const p of this.players) {
        if (p.seat === fromSeat || !this.activeForPlay(p)) continue;
        const list = [];
        if (this.canWinOnDiscard(p, t)) list.push('hu');
        if (canPengWith(p, t.t)) list.push('peng');
        if (canGangWith(p, t.t)) list.push('gang');
        if (list.length) options[p.seat] = list;
      }
      const seats = Object.keys(options).map(Number);
      if (!seats.length) { this.afterDiscardNoClaim(fromSeat); return; }
      this.claim = {
        from: fromSeat, tile: t, options: options, responses: {},
        deadline: Date.now() + (this.fast ? 0 : this.cfg.claimMs),
        kind: 'discard'
      };
      for (const s of seats) this.claim.responses[s] = null;
      this.aiAt = Date.now() + (this.fast ? 0 : 300 + Math.random() * 500);
      this.turnDeadline = 0;
      this.phase = 'play';
    }

    canWinOnDiscard(p, t) {
      if (this.cfg.mode === 'xuezhan' && p.hued) return false;
      if (this.selfHuLock === p.seat) return false;
      if (p.que != null && suitOf(t.t) === p.que) return false;
      if (hasQue(p)) return false;
      const hand = p.hand.concat([{ t: t.t, uid: t.uid }]);
      return analyzeWin(hand, p.melds).ok;
    }

    afterDiscardNoClaim(fromSeat) {
      const nxSeat = this.nextActiveSeat(fromSeat);
      if (nxSeat < 0) { this.endHand('无人可继续'); return; }
      this.beginTurn(nxSeat, true);
    }

    /* 响应碰杠胡 */
    respond(seat, a, extra) {
      if (!this.claim || this.claim.responses[seat] === undefined) return { ok: false, msg: '没有可响应的牌' };
      if (this.claim.responses[seat] !== null) return { ok: false, msg: '已响应' };
      const opts = this.claim.options[seat] || [];
      if (a === 'pass') {
        this.claim.responses[seat] = { a: 'pass' };
      } else if (a === 'hu') {
        if (opts.indexOf('hu') < 0) return { ok: false, msg: '不能胡' };
        this.claim.responses[seat] = { a: 'hu' };
      } else if (a === 'peng') {
        if (opts.indexOf('peng') < 0) return { ok: false, msg: '不能碰' };
        this.claim.responses[seat] = { a: 'peng' };
      } else if (a === 'gang') {
        if (opts.indexOf('gang') < 0) return { ok: false, msg: '不能杠' };
        this.claim.responses[seat] = { a: 'gang' };
      } else return { ok: false, msg: '无效操作' };
      this.seq++;
      this.checkClaimDone();
      return { ok: true };
    }

    checkClaimDone() {
      if (!this.claim) return;
      const res = this.claim.responses;
      if (Object.keys(res).some(k => res[k] === null)) return;
      this.resolveClaim();
    }

    resolveClaim() {
      const c = this.claim;
      if (!c) return;
      this.claim = null;
      const order = (from) => {
        const list = [];
        for (let k = 1; k <= 4; k++) {
          const s = (from + k) % 4;
          if (c.responses[s] && c.responses[s].a === 'hu') list.push(s);
        }
        return list;
      };
      const huWinners = order(c.from);
      if (huWinners.length) {
        if (!this.cfg.multiHu) huWinners.length = 1;
        const discP = this.players[c.from];
        // 血战：炮牌被胡家收走；血流：留在牌河
        if (this.cfg.mode === 'xuezhan') {
          const di = discP.discards.map(x => x.uid).lastIndexOf(c.tile.uid);
          if (di >= 0) discP.discards.splice(di, 1);
        }
        for (const s of huWinners) this.doHu(s, c.tile, null);
        this.checkBloodEnd();
        if (this.phase === 'end') return;
        this.afterDiscardNoClaim(c.from);
        return;
      }
      for (const s of Object.keys(c.responses)) {
        const r = c.responses[s];
        if (r && r.a === 'gang') {
          this.doZhiGang(Number(s), c.tile, c.from);
          return;
        }
      }
      for (const s of Object.keys(c.responses)) {
        const r = c.responses[s];
        if (r && r.a === 'peng') {
          this.doPeng(Number(s), c.tile, c.from);
          return;
        }
      }
      this.afterDiscardNoClaim(c.from);
    }

    removeTiles(p, t, n) {
      let left = n;
      for (let i = p.hand.length - 1; i >= 0 && left > 0; i--) {
        if (p.hand[i].t === t) { p.hand.splice(i, 1); left--; }
      }
      return n - left;
    }

    doPeng(seat, t, from) {
      const p = this.players[seat];
      const taken = this.removeTiles(p, t.t, 2);
      if (taken !== 2) return;
      const fp = this.players[from];
      const di = fp.discards.map(x => x.uid).findIndex(x => x === t.uid);
      if (di >= 0) fp.discards.splice(di, 1);
      p.melds.push({ kind: 'peng', t: t.t, from: from, tiles: [t, tile(t.t), tile(t.t)] });
      this.lastAction = { type: 'peng', seat: seat, tile: t };
      this.logEvent(p.name + ' 碰 ' + tileName(t.t));
      this.current = seat;
      this.drawn = null;
      this.selfHuLock = -1;
      this.startTurnClock();
      this.seq++;
    }

    doZhiGang(seat, t, from) {
      const p = this.players[seat];
      const taken = this.removeTiles(p, t.t, 3);
      if (taken !== 3) return;
      const fp = this.players[from];
      const di = fp.discards.map(x => x.uid).findIndex(x => x === t.uid);
      if (di >= 0) fp.discards.splice(di, 1);
      p.melds.push({ kind: 'zhi', t: t.t, from: from, tiles: [t, tile(t.t), tile(t.t), tile(t.t)] });
      this.lastAction = { type: 'gang', gangKind: 'zhi', seat: seat, tile: t };
      this.logEvent(p.name + ' 直杠 ' + tileName(t.t));
      this.payGang(seat, 'zhi');
      const repl = this.drawTail();
      if (!repl) { this.endHand('牌墙摸完'); return; }
      p.hand.push(repl);
      sortTiles(p.hand);
      this.current = seat;
      this.drawn = repl;
      this.lastGangSeat = seat;
      this.selfHuLock = -1;
      this.startTurnClock();
      this.seq++;
    }

    /* 自家操作：暗杠/补杠/自摸胡 */
    selfAction(seat, a, t) {
      if (this.phase !== 'play' || this.current !== seat) return { ok: false, msg: '还没轮到你' };
      if (this.claim) return { ok: false, msg: '等待其他玩家响应' };
      const p = this.players[seat];
      if (a === 'hu') {
        if (!this.drawn) return { ok: false, msg: '不能胡' };
        if (this.selfHuLock === seat) return { ok: false, msg: '已胡' };
        if (hasQue(p)) return { ok: false, msg: '请先打完缺门' };
        const sc = scoreHand(p.hand.slice(), p.melds, {
          gangFlower: this.lastGangSeat === seat,
          haidi: this.wallLeft() === 0,
          tianHu: this.discardCount === 0 && seat === this.dealer && p.melds.length === 0,
          diHu: false
        }, this.cfg);
        if (!sc.ok) return { ok: false, msg: '不能胡' };
        this.doHu(seat, this.drawn, sc, true);
        this.checkBloodEnd();
        if (this.phase === 'end') return { ok: true };
        if (this.cfg.mode === 'xueliu') {
          this.selfHuLock = seat;
          this.startTurnClock();
        } else {
          const nx = this.nextActiveSeat(seat);
          if (nx < 0) { this.endHand('只剩一人'); return { ok: true }; }
          this.beginTurn(nx, true);
        }
        this.seq++;
        return { ok: true };
      }
      if (a === 'angang') {
        if (!this.drawn) return { ok: false, msg: '不能杠' };
        if (anGangOptions(p).indexOf(t) < 0) return { ok: false, msg: '不能暗杠' };
        const tiles = [];
        for (let i = 0; i < 4; i++) tiles.push(p.hand.splice(p.hand.findIndex(x => x.t === t), 1)[0]);
        p.melds.push({ kind: 'an', t: t, from: seat, tiles: tiles });
        this.lastAction = { type: 'gang', gangKind: 'an', seat: seat, tile: { t: t, uid: tiles[0].uid } };
        this.logEvent(p.name + ' 暗杠');
        this.payGang(seat, 'an');
        const repl = this.drawTail();
        if (!repl) { this.endHand('牌墙摸完'); return { ok: true }; }
        p.hand.push(repl); sortTiles(p.hand);
        this.drawn = repl; this.lastGangSeat = seat; this.selfHuLock = -1;
        this.startTurnClock();
        this.seq++;
        return { ok: true };
      }
      if (a === 'bugang') {
        if (!this.drawn) return { ok: false, msg: '不能杠' };
        if (buGangOptions(p).indexOf(t) < 0) return { ok: false, msg: '不能补杠' };
        // 先检查抢杠胡
        const robbers = [];
        for (const q of this.players) {
          if (q.seat === seat || !this.activeForPlay(q)) continue;
          if (q.que != null && suitOf(t) === q.que) continue;
          if (hasQue(q)) continue;
          const hand = q.hand.concat([{ t: t, uid: 0 }]);
          if (analyzeWin(hand, q.melds).ok) robbers.push(q.seat);
        }
        this.pendingGang = { seat: seat, t: t };
        if (robbers.length) {
          const options = {};
          for (const s of robbers) options[s] = ['hu'];
          this.claim = {
            from: seat, tile: { t: t, uid: 0 }, options: options, responses: {},
            deadline: Date.now() + (this.fast ? 0 : this.cfg.claimMs), kind: 'qiang'
          };
          for (const s of robbers) this.claim.responses[s] = null;
          this.aiAt = Date.now() + (this.fast ? 0 : 300 + Math.random() * 500);
          this.turnDeadline = 0;
          this.seq++;
          return { ok: true };
        }
        this.execBuGang(seat, t);
        return { ok: true };
      }
      return { ok: false, msg: '无效操作' };
    }

    execBuGang(seat, t) {
      const p = this.players[seat];
      const m = p.melds.find(x => x.kind === 'peng' && x.t === t);
      if (!m) return;
      const idx = p.hand.findIndex(x => x.t === t);
      if (idx < 0) return;
      const tl = p.hand.splice(idx, 1)[0];
      m.kind = 'bu';
      m.tiles.push(tl);
      this.lastAction = { type: 'gang', gangKind: 'bu', seat: seat, tile: tl };
      this.logEvent(p.name + ' 补杠 ' + tileName(t));
      this.payGang(seat, 'bu');
      const repl = this.drawTail();
      if (!repl) { this.endHand('牌墙摸完'); return; }
      p.hand.push(repl); sortTiles(p.hand);
      this.current = seat; this.drawn = repl; this.lastGangSeat = seat;
      this.selfHuLock = -1;
      this.startTurnClock();
      this.seq++;
    }

    payGang(seat, kind) {
      const amount = kind === 'an' ? this.cfg.base * 2 : this.cfg.base;
      let paid = 0;
      for (const p of this.players) {
        if (p.seat === seat || !this.activeForPlay(p)) continue;
        this.transfer(p.seat, seat, amount);
        paid += amount;
      }
      this.logEvent(this.players[seat].name + (kind === 'an' ? ' 暗杠' : ' 杠') + '，收 ' + paid + ' 分');
    }

    transfer(from, to, amount) {
      if (from === to || amount === 0) return;
      this.players[from].chips -= amount;
      this.players[to].chips += amount;
    }

    doHu(seat, winTile, preset, zimo) {
      const p = this.players[seat];
      let sc = preset;
      if (!sc) {
        const hand = p.hand.concat([{ t: winTile.t, uid: winTile.uid }]);
        sc = scoreHand(hand, p.melds, {
          gangPao: this.lastDiscard && this.lastDiscard.afterGang,
          qiangGang: this.claim && this.claim.kind === 'qiang',
          haidi: false,
          tianHu: false,
          diHu: this.discardCount === 1 && seat !== this.dealer && p.melds.length === 0
        }, this.cfg);
      }
      if (!sc || !sc.ok) {
        // 抢杠胡牌张不入手（牌还在杠者手中）
        return false;
      }
      if (!zimo) {
        const hand = p.hand.concat([{ t: winTile.t, uid: winTile.uid }]);
        sc = scoreHand(hand, p.melds, {
          gangPao: this.lastDiscard && this.lastDiscard.afterGang,
          qiangGang: this.claim && this.claim.kind === 'qiang',
          diHu: this.discardCount === 1 && seat !== this.dealer && p.melds.length === 0
        }, this.cfg);
        if (sc.ok && this.claim && this.claim.kind === 'qiang') {
          const gp = this.players[this.claim.from];
          const gi = gp.hand.findIndex(x => x.t === winTile.t);
          let robbed = null;
          if (gi >= 0) robbed = gp.hand.splice(gi, 1)[0];
          if (this.cfg.mode === 'xuezhan') p.hand.push(robbed || { t: winTile.t, uid: winTile.uid });
          else if (robbed) gp.discards.push(robbed);
        } else if (sc.ok && this.cfg.mode === 'xuezhan') {
          p.hand.push({ t: winTile.t, uid: winTile.uid });
        }
      }
      sortTiles(p.hand);
      p.hued = true;
      p.huInfo.push({
        fan: sc.fan, fanEff: sc.fanEff, score: sc.score,
        patterns: sc.patterns, zimo: !!zimo, from: zimo ? seat : (this.claim ? this.claim.from : -1),
        tile: winTile.t, hand: this.cfg.mode === 'xuezhuan' ? null : null
      });
      const winners = [];
      if (zimo) {
        const payers = this.players.filter(x => x.seat !== seat && this.activeForPlay(x));
        for (const q of payers) { this.transfer(q.seat, seat, sc.score); winners.push(q.seat); }
      } else {
        const from = this.claim ? this.claim.from : this.lastDiscard.seat;
        this.transfer(from, seat, sc.score);
        winners.push(from);
      }
      this.lastAction = {
        type: 'hu', seat: seat, zimo: !!zimo, tile: winTile,
        fan: sc.fan, fanEff: sc.fanEff, score: sc.score, patterns: sc.patterns
      };
      this.logEvent(p.name + (zimo ? ' 自摸 ' : ' 胡 ') + tileName(winTile.t) +
        '（' + sc.patterns.map(x => x.name).join(' ') + '，' + sc.fan + '番）');
      this.pendingGang = null;
      this.selfHuLock = -1;
      return true;
    }

    checkBloodEnd() {
      if (this.cfg.mode !== 'xuezhan') return;
      if (this.activeSeats().length <= 1) this.endHand('血战结束');
    }

    endHand(reason) {
      if (this.phase === 'end') return;
      this.phase = 'end';
      this.claim = null;
      this.pendingGang = null;
      const before = this.startChips || this.players.map(p => p.chips);
      const extra = [];
      if (this.cfg.mode === 'xuezhan') {
        const active = this.players.filter(p => !p.hued);
        const infos = active.map(p => ({ p: p, t: tingInfo(p, this.cfg) }));
        if (this.cfg.chaHuaZhu) {
          for (const p of active) {
            if (!hasQue(p)) continue;
            const amount = this.cfg.base * Math.pow(2, this.cfg.cap);
            for (const q of active) {
              if (q.seat === p.seat) continue;
              this.transfer(p.seat, q.seat, amount);
            }
            extra.push({ seat: p.seat, type: '花猪', amount: amount });
            this.logEvent(p.name + ' 花猪，赔每家 ' + amount);
          }
        }
        if (this.cfg.chaDaJiao) {
          for (const a of infos) {
            if (hasQue(a.p) || a.t.ting) continue;
            for (const b of infos) {
              if (a.p.seat === b.p.seat || !b.t.ting) continue;
              const amount = Math.min(this.cfg.base * 4, this.cfg.base * Math.pow(2, this.cfg.cap));
              this.transfer(a.p.seat, b.p.seat, amount);
              extra.push({ seat: a.p.seat, type: '查大叫', to: b.p.seat, amount: amount });
            }
            this.logEvent(a.p.name + ' 未听牌，赔大叫');
          }
        }
      }
      const dealerWon = this.players[this.dealer].hued;
      let nextDealer = this.dealer;
      if (!dealerWon) {
        const nx = (this.dealer + 1) % 4;
        nextDealer = nx;
      }
      this.result = {
        reason: reason || '', handNo: this.handNo, dealer: this.dealer,
        nextDealer: nextDealer, mode: this.cfg.mode,
        players: this.players.map((p, i) => ({
          seat: i, name: p.name, chips: p.chips, delta: p.chips - before[i],
          hued: p.hued, huInfo: p.huInfo, que: p.que, ting: tingInfo(p, this.cfg),
          hand: p.hand, melds: p.melds
        })),
        extra: extra, at: Date.now()
      };
      this.seq++;
      this.lastAction = { type: 'end', reason: reason };
    }

    /* ---------------- 选项 / 视图 ---------------- */

    selfOptions(seat) {
      const p = this.players[seat];
      const out = { discard: false, hu: false, gangs: [] };
      if (this.phase !== 'play' || this.current !== seat) return out;
      out.discard = true;
      if (!this.drawn) return out;
      if (this.selfHuLock === seat) return out;
      if (this.drawn) {
        if (!hasQue(p)) {
          const sc = scoreHand(p.hand.slice(), p.melds, { gangFlower: this.lastGangSeat === seat, haidi: this.wallLeft() === 0 }, this.cfg);
          out.hu = sc.ok;
        }
        for (const t of anGangOptions(p)) out.gangs.push({ t: t, kind: 'an' });
        for (const t of buGangOptions(p)) out.gangs.push({ t: t, kind: 'bu' });
      }
      return out;
    }

    optionsFor(seat) {
      const out = { act: null, claim: [], self: null, canQue: false, canSwap: false };
      const p = this.players[seat];
      if (this.phase === 'que' && p.que == null) out.canQue = true;
      if (this.phase === 'swap' && !p.swapped) out.canSwap = true;
      if (this.claim && this.claim.responses[seat] === null) {
        out.act = 'claim';
        out.claim = (this.claim.options[seat] || []).slice();
      } else if (this.phase === 'play' && this.current === seat) {
        out.act = 'turn';
        out.self = this.selfOptions(seat);
      }
      return out;
    }

    snapshot(seat) {
      const revealAll = this.phase === 'end';
      return {
        seq: this.seq,
        handNo: this.handNo,
        dealer: this.dealer,
        phase: this.phase,
        current: this.current,
        wallLeft: this.wallLeft(),
        mode: this.cfg.mode,
        cfg: this.cfg,
        swapDir: this.swapDir,
        phaseDeadline: this.phaseDeadline || 0,
        turnDeadline: this.turnDeadline || 0,
        longThinkSeat: this.longThinkSeat,
        claim: this.claim ? {
          from: this.claim.from, tile: this.claim.tile,
          deadline: this.claim.deadline, kind: this.claim.kind
        } : null,
        me: {
          seat: seat, que: this.players[seat].que,
          hued: this.players[seat].hued,
          hand: this.players[seat].hand,
          melds: this.players[seat].melds,
          discards: this.players[seat].discards,

    let ctx = null, voice = null, lastAt = 0;
    const PREF = ['Xiaoxiao', 'Xiaoyi', 'Huihui', 'Yaoyao', 'Tingting', 'Yunxi', 'Yunyang', '女', 'Female'];
    function pickVoice() {
      if (typeof speechSynthesis === 'undefined') return;
      let vs = [];
      try { vs = speechSynthesis.getVoices() || []; } catch (e) { return; }
      const zh = vs.filter(v => /zh|cmn|chinese/i.test(v.lang || '') || /中文|普通话/.test(v.name || ''));
      voice = zh.find(v => PREF.some(p => (v.name || '').indexOf(p) >= 0)) ||
        zh.find(v => /female/i.test(v.name || '')) || zh[0] || null;
    }
    function unlock() {
      if (!ctx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        } catch (e) {}
      }
      if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      pickVoice();
    }
    function tone(freq, dur, delay, vol, type) {
      if (!ctx || !S.sound) return;
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol == null ? .12 : vol, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0008, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    }
    function thud() {
      if (!ctx || !S.sound) return;
      try {
        const len = Math.floor(ctx.sampleRate * .09);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1700;
        const g = ctx.createGain(); g.gain.value = .3;
        src.connect(f); f.connect(g); g.connect(ctx.destination);
        src.start(ctx.currentTime);
      } catch (e) {}
    }
    function say(text) {
      if (!S.sound || typeof speechSynthesis === 'undefined') return;
      const now = Date.now();
      if (now - lastAt < 70) return;
      lastAt = now;
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        if (voice) u.voice = voice;
        u.rate = 1.06; u.pitch = 1.18; u.volume = 1;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }
    function nameOfTile(t) {
      const suit = Math.floor(t / 9), rank = t % 9;
      return CN[rank] + SUITS[suit];
    }
    function tile(t) {
      if (!S.sound) return;
      unlock();
      const suit = Math.floor(t / 9), rank = t % 9;
      tone(320 + rank * 24 + suit * 150, .07, 0, .055, 'triangle');
      thud();
      setTimeout(() => say(nameOfTile(t)), 45);
    }
    function sayTile(word, t) {
      if (!S.sound) return;
      unlock();
      if (word === '碰') tone(520, .1);
      else if (word === '杠') { tone(660, .11); tone(880, .1, .1); }
      else if (word === '胡') { tone(760, .12); tone(980, .16, .1); tone(1240, .18, .24); }
      else tone(460, .08);
      say(t != null ? word + nameOfTile(t) : word);
    }
    function fan() {
      if (!S.sound) return;
      unlock();
      [660, 880, 1046, 1318].forEach((f, i) => tone(f, .18, i * .09, .1, 'triangle'));
    }
    return { unlock, pickVoice, tile, say: sayTile, fan };
  })();

    const el = document.createElement('div');

    while (wrap.firstChild && wrap.firstChild.classList && wrap.firstChild.classList.contains('toast')) {
      wrap.removeChild(wrap.firstChild);

    wrap.appendChild(el);

  /* ---------------- 大厅 ---------------- */
  function lobbyData() {
    if (!S.room) return null;
    return {
      code: S.room.code, cfg: S.room.cfg, hostSeat: S.room.hostSeat, started: !!S.room.started,
      seats: S.room.seats.map(s => s ? {

  function renderLobby() {

    if (!lobby) return;

    const filled = seats.filter(Boolean).length;

    $('#lobbyTip').textContent = lobby.started ? '对局进行中…' : `${filled}/4 玩家已加入 · ${allReady ? '可以开始' : '等待其他玩家准备'}`;
    $('#btnStart').style.display = isHost ? '' : 'none';
    $('#btnStart').disabled = !(isHost && filled === 4 && allReady);
    $('#btnReady').style.display = (S.mode === 'client') ? '' : 'none';
    if (S.mode === 'client') {
      const me = seats[S.seat];
