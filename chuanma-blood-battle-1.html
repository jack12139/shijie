      (c.huan ? ' · 换三张' : '');
  }
  function pushLobby() {
    if (!S.room) return;
    const data = lobbyData();
    for (const s of S.room.seats) {
      if (!s || s.seat === S.seat || !s.conn || !s.connected || s.conn.open === false) continue;
      try { s.conn.send({ t: 'lobby', lobby: data }); } catch (e) {}
    }
    if (S.screen === 'lobby') renderLobby();
  }

  /* ---------------- Peer 加载 ---------------- */
  let peerPromise = null;
  function loadPeer() {
    if (window.Peer) return Promise.resolve(window.Peer);
    if (peerPromise) return peerPromise;
    peerPromise = new Promise((res, rej) => {
      const srcs = [
        'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
        'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'
      ];
      let i = 0;
      const next = () => {
        if (i >= srcs.length) { peerPromise = null; return rej(new Error('PeerJS 加载失败')); }
        const s = document.createElement('script');
        s.src = srcs[i++];
        s.onload = () => res(window.Peer);
        s.onerror = next;
        document.head.appendChild(s);
      };
      next();
    });
    return peerPromise;
  }

  /* ---------------- 主机 ---------------- */
  async function createRoom() {
    if (S.mode) return;
    const name = getName();
    $('#netDot').textContent = '连接信令…';
    try { await loadPeer(); }
    catch (e) { toast('联机组件加载失败，仅可使用单机模式'); $('#netDot').textContent = '联机不可用'; return; }
    let tries = 0;
    const attempt = () => {
      const code = genCode();
      const peer = new Peer('mj-' + code, { debug: 1 });
      let opened = false;
      peer.on('open', () => {
        opened = true;
        S.mode = 'host';
        S.seat = 0;
        S.net.peer = peer;
        S.net.code = code;
        S.net.hostId = peer.id;
        S.net.isHost = true;
        S.net.connected = true;
        S.seq = -1;
        S.room = {
          code, cfg: Object.assign({}, S.cfg), hostSeat: 0, started: false,
          seats: [
            { seat: 0, name, token: makeToken(), peerId: peer.id, connected: true, ready: true, isAI: false, conn: null },
            null, null, null
          ]
        };
        peer.on('connection', conn => hostAccept(conn));
        peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
        peer.on('error', err => { if (err.type !== 'peer-unavailable') setNetBanner('网络：' + errText(err)); });
        $('#netDot').textContent = 'P2P 就绪';
        showScreen('lobby');
        renderLobby();
        setNetBanner('');
      });
      peer.on('error', err => {
        const retryable = err.type === 'unavailable-id' || err.type === 'network' ||
          err.type === 'server-error' || err.type === 'socket-error';
        if (!opened && retryable && tries++ < 8) {
          try { peer.destroy(); } catch (e) {}
          setTimeout(attempt, 500 + tries * 400);
          return;
        }
        if (!opened) {
          toast('创建房间失败：' + errText(err));
          $('#netDot').textContent = '信令异常';
          try { peer.destroy(); } catch (e) {}
        } else if (err.type !== 'peer-unavailable') {
          setNetBanner('网络：' + errText(err));
        }
      });
    };
    attempt();
  }

  function jrn(tag, extra) {
    if (!S.game) return;
    const g = S.game;
    const e = Object.assign({
      tag, at: Date.now(), seq: g.seq, cur: g.current, claim: !!g.claim,
      hands: g.players.map(p => p.hand.length), melds: g.players.map(p => p.melds.length),
      drawn: !!g.drawn
    }, extra || {});
    S.journal.push(e);
    if (S.journal.length > 200) S.journal.shift();
  }
  function hostAccept(conn) {
    conn.on('data', msg => { try { hostMsg(conn, msg); } catch (e) { console.error(e); } });
    const drop = () => hostDrop(conn);
    conn.on('close', drop);
    conn.on('error', drop);
  }
  function hostMsg(conn, msg) {
    if (!msg || !S.room) return;
    if (msg.t === 'hello') {
      let seat = S.room.seats.findIndex(s => s && msg.token && s.token === msg.token);
      if (seat < 0) {
        if (S.room.started) { try { conn.send({ t: 'reject', msg: '对局已开始，无法加入' }); } catch (e) {} try { conn.close(); } catch (e) {} return; }
        seat = S.room.seats.findIndex((s, i) => i > 0 && !s);
        if (seat < 0) { try { conn.send({ t: 'reject', msg: '房间已满' }); } catch (e) {} try { conn.close(); } catch (e) {} return; }
        S.room.seats[seat] = {
          seat, name: (msg.name || '玩家').slice(0, 8), token: msg.token || makeToken(),
          peerId: conn.peer, connected: true, ready: false, isAI: false, conn
        };
      } else {
        const s = S.room.seats[seat];
        const old = s.conn;
        s.conn = conn;
        if (old && old !== conn) { try { old.close(); } catch (e) {} }
        s.peerId = conn.peer;
        s.connected = true;
        if (msg.name) s.name = String(msg.name).slice(0, 8);
        if (S.game && S.game.players[seat]) {
          S.game.players[seat].online = true;
          S.game.players[seat].auto = false;
          S.game.players[seat].name = s.name;
        }
      }
      conn._seat = seat;
      jrn('hello', { seat: seat, token: S.room.seats[seat].token, peerId: conn.peer });
      try {
        conn.send({ t: 'welcome', seat, token: S.room.seats[seat].token, code: S.room.code, lobby: lobbyData(), cfg: S.room.cfg });
        if (S.room.started && S.game) conn.send({ t: 'state', view: S.game.snapshot(seat), now: Date.now() });
      } catch (e) {}
      pushLobby();
      if (S.room.started) pushState(true);
    } else if (msg.t === 'ready') {
      const s = S.room.seats[conn._seat];
      if (s) { s.ready = !!msg.v; pushLobby(); }
    } else if (msg.t === 'intent') {
      S.net.intents++;
      const s = S.room.seats[conn._seat];
      if (!s || s.conn !== conn || !S.room.started || !S.game) {
        jrn('stale-intent', { seat: conn._seat, a: msg.a });
        return;
      }
      if (S.game.players[s.seat]) { S.game.players[s.seat].online = true; S.game.players[s.seat].auto = false; }
      const ok = S.game.apply(s.seat, msg.a);
      jrn('intent', { seat: s.seat, a: msg.a, ok: ok });
      if (!ok) { try { conn.send({ t: 'toast', msg: '操作无效或已超时' }); } catch (e) {} }
      pushState(true);
    } else if (msg.t === 'ping') {
      try { conn.send({ t: 'pong' }); } catch (e) {}
    } else if (msg.t === 'bye') {
      hostDrop(conn);
    }
  }
  function hostDrop(conn) {
    if (!S.room) return;
    const seat = conn._seat;
    if (seat == null) return;
    const s = S.room.seats[seat];
    if (!s || s.conn !== conn) return;
    s.conn = null;
    s.connected = false;
    jrn('drop', { seat: seat });
    try { conn.close(); } catch (e) {}
    if (S.game && S.game.players[seat]) {
      S.game.players[seat].online = false;
      S.game.players[seat].auto = true;
    }
    pushLobby();
    pushState(true);
  }
  function pushState(force) {
    if (!S.game || !S.room) return;
    if (S.net.pushing) return;
    S.net.pushing = true;
    S.net.pushes++;
    const now = Date.now();
    try {
      if (S.mode === 'host' || S.mode === 'solo') {
        applyView(S.game.snapshot(S.seat), now);
        for (const s of S.room.seats) {
          if (!s || s.seat === S.seat || !s.conn || !s.connected || s.conn.open === false) continue;
          let view;
          try { view = S.game.snapshot(s.seat); } catch (e) { continue; }
          try { s.conn.send({ t: 'state', view, now }); S.net.sent++; S.net.sentSeq = view.seq; } catch (e) {}
        }
        if (S.mode === 'host') {
          const bs = S.room.seats.find(s => s && s.seat !== S.seat && s.connected && s.conn && s.conn.open !== false);
          if (bs && S.room.started) {
            try {
              bs.conn.send({
                t: 'backup',
                data: {
                  raw: S.game.raw(), cfg: S.room.cfg, code: S.room.code,
                  seats: S.room.seats.map(s => s ? {
                    seat: s.seat, name: s.name, token: s.token, peerId: s.peerId, isAI: s.isAI
                  } : null),
                  at: now
                }
              });
            } catch (e) {}
          }
        }
        S.lastPush = now;
        if (S.mode === 'host' && S.room && now - (S.lastSave || 0) > 1500) {
          S.lastSave = now;
          try {
            store.set('mj_host_' + S.room.code, {
              room: {
                code: S.room.code, cfg: S.room.cfg, hostSeat: S.room.hostSeat,
                started: S.room.started,
                seats: S.room.seats.map(s => s ? {
                  seat: s.seat, name: s.name, token: s.token, peerId: s.peerId, isAI: s.isAI
                } : null)
              },
              raw: S.game.raw(), at: now
            });
            store.set('mj_host_last', { code: S.room.code, at: now });

        }
      }
    } finally {
      S.net.pushing = false;
    }
  }
  async function restoreHost(code) {

  /* ---------------- 客户端 ---------------- */
  async function joinRoom(codeIn, hostId) {
    const code = String(codeIn || '').replace(/\D/g, '').slice(0, 4);
    if (!/^\d{4}$/.test(code)) return toast('请输入 4 位数字房间码');
    if (S.mode) return;
    $('#codeInput').value = code;
    $('#netDot').textContent = '连接房间…';
    try { await loadPeer(); }
    catch (e) { toast('联机组件加载失败，仅可使用单机模式'); $('#netDot').textContent = '联机不可用'; return; }
    S.mode = 'client';
    S.net.code = code;
    S.net.token = sess.get('mj_tok_' + code, '') || makeToken();
    sess.set('mj_tok_' + code, S.net.token);
    const saved = store.get('mj_hostid_' + code, '');
    S.net.hostId = hostId || saved || ('mj-' + code);
    S.net.attempts = 0;
    S.seq = -1;
    S.history = []; S.histOpen = false; S.ui.resultAt = 0;
    openClientPeer();
  }
  function openClientPeer() {
    if (S.mode !== 'client') return;
    const myId = sess.get('mj_pid_' + S.net.code, '') || ('mju-' + randStr(10));
    sess.set('mj_pid_' + S.net.code, myId);
    const peer = new Peer(myId, { debug: 1 });
    S.net.peer = peer;
    S.net.connecting = false;
    let opened = false;
    peer.on('open', () => { opened = true; S.net.peerRetries = 0; clientConnect(); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('connection', conn => {
      conn.on('data', msg => {
        try { onClientMsg(msg); } catch (e) {}
      });
      conn.on('error', () => {});
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch (e) {}
        sess.set('mj_pid_' + S.net.code, 'mju-' + randStr(10));
        setTimeout(() => { if (S.mode === 'client') openClientPeer(); }, 300);
        return;
      }
      if (!opened && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error')) {
        try { peer.destroy(); } catch (e) {}
        S.net.peerRetries = (S.net.peerRetries || 0) + 1;
        if (S.net.peerRetries <= 12) {
          setNetBanner('信令连接失败，重试中…');
          setTimeout(() => { if (S.mode === 'client') openClientPeer(); }, Math.min(4000, 600 * S.net.peerRetries));
        } else {
          clientOffline('信令服务器不可用');
        }
        return;
      }
      if (!opened || err.type === 'peer-unavailable') {
        clientOffline(errText(err));
      }
    });
  }
  function clientConnect() {
    if (S.mode !== 'client' || !S.net.peer) return;
    if (S.net.connecting) return;
    const peer = S.net.peer;
    if (peer.destroyed) { openClientPeer(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
    let conn;
    try { conn = peer.connect(S.net.hostId, { reliable: true, serialization: 'json' }); }
    catch (e) { scheduleRetry(); return; }
    S.net.connecting = true;
    S.net.conn = conn;
    const to = setTimeout(() => {
      if (S.net.conn === conn && !S.net.connected) {
        S.net.connecting = false;
        try { conn.close(); } catch (e) {}
        scheduleRetry();
      }
    }, 8000);
    conn.on('open', () => {
      clearTimeout(to);
      S.net.connecting = false;
      if (S.net.conn !== conn) return;
      S.net.connected = true;
      S.net.attempts = 0;
      try { conn.send({ t: 'hello', name: getName(), token: S.net.token, peerId: peer.id }); } catch (e) {}
      setNetBanner('');
    });
    conn.on('data', onClientMsg);
    conn.on('close', () => {
      S.net.connecting = false;
      if (S.net.conn === conn) {
        S.net.connected = false;
        if (S.mode === 'client' && (S.screen === 'table' || S.screen === 'lobby')) clientOffline('连接中断');
      }
    });
    conn.on('error', () => { S.net.connecting = false; });
  }
  function clientOffline(text) {
    if (S.mode !== 'client') return;
    if (text) setNetBanner(text + '，重连中…');
    scheduleRetry();
  }
  function scheduleRetry() {
    if (S.mode !== 'client') return;
    if (S.net.connected) return;
    clearTimeout(S.net.retry);
    S.net.attempts++;
    if (S.autoResume && S.net.attempts > 12) {
      S.autoResume = false;
      toast('恢复房间失败，请重新加入');
      leaveToHome(true);
      return;
    }
    if (S.net.attempts > 80) { setNetBanner('无法连接房主，请确认房间码'); return; }
    const wait = Math.min(3000, 700 + S.net.attempts * 260);
    S.net.retry = setTimeout(() => {
      if (S.mode !== 'client') return;
      if (!S.net.peer || S.net.peer.destroyed) openClientPeer();
      else clientConnect();
    }, wait);
  }
  function onClientMsg(msg) {
    if (!msg || S.mode !== 'client') return;
    S.net.connected = true;
    S.net.attempts = 0;
    S.lastMsg = Date.now();
    setNetBanner('');
    if (msg.t === 'welcome') {
      S.seat = msg.seat;
      S.net.code = msg.code;
      S.net.token = msg.token;
      S.lobby = msg.lobby;
      S.roomCfg = msg.cfg;
      S.seq = -1;
      S.autoResume = false;
      store.set('mj_hostid_' + msg.code, S.net.hostId);
      store.set('mj_session', { code: msg.code, token: msg.token, seat: msg.seat, hostId: S.net.hostId, at: Date.now() });
      $('#netDot').textContent = 'P2P 已连接';
      if (!msg.lobby.started) { showScreen('lobby'); renderLobby(); }
      else setNetBanner('正在恢复对局…');
    } else if (msg.t === 'lobby') {
      S.lobby = msg.lobby;
      if (!msg.lobby.started) { if (S.screen !== 'lobby') showScreen('lobby'); renderLobby(); }
    } else if (msg.t === 'state') {
      S.net.recv++;
      S.net.recvSeq = msg.view ? msg.view.seq : -1;
      S.net.backupAt = Date.now();
      if (msg.view && msg.view.seq >= S.seq) {
        S.clockSkew = Date.now() - (msg.now || Date.now());
        applyView(msg.view, msg.now);
      }
      if (S.screen !== 'table') { showScreen('table'); setNetBanner(''); }
      S.lastMsg = Date.now();
    } else if (msg.t === 'backup') {
      S.net.backup = msg.data;
      S.net.backupAt = Date.now();
    } else if (msg.t === 'hostchange') {
      if (msg.hostId === S.net.hostId && (S.net.connected || S.net.connecting)) return;
      S.net.hostId = msg.hostId;
      store.set('mj_hostid_' + (msg.code || S.net.code), msg.hostId);
      S.seq = -1;
      S.lastMsg = Date.now();
      S.net.connected = false;
      S.net.connecting = false;
      setNetBanner('房主已迁移，正在重连…');
      try { S.net.conn && S.net.conn.close(); } catch (e) {}
      setTimeout(clientConnect, 600);
    } else if (msg.t === 'toast') {
      toast(msg.msg);
    } else if (msg.t === 'reject') {
      toast(msg.msg || '无法加入房间');
      leaveToHome(true);
    }
  }

  /* ---------------- 备份主机接管 ---------------- */
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function openPeerAsync(id, ms) {
    return new Promise((resolve, reject) => {
      let settled = false;
      let peer;
      try { peer = new Peer(id, { debug: 1 }); }
      catch (e) { return reject(e); }
      const to = setTimeout(() => {
        if (settled) return;
        settled = true;
        try { peer.destroy(); } catch (e) {}
        reject(new Error('信令超时'));
      }, ms || 9000);
      peer.on('open', () => {
        if (settled) return;
        settled = true;
        clearTimeout(to);
        resolve(peer);
      });
      peer.on('error', err => {
        if (settled) return;
        settled = true;
        clearTimeout(to);
        try { peer.destroy(); } catch (e) {}
        reject(err);
      });
    });
  }
  function notifyPeers(peer, code, myId, data, mySeat) {
    const seats = data.seats || [];
    for (let i = 0; i < 4; i++) {
      const s = seats[i];
      if (!s || i === mySeat || !s.peerId) continue;
      try {
        const c = peer.connect(s.peerId, { reliable: true, serialization: 'json' });
        c.on('open', () => {
          try { c.send({ t: 'hostchange', hostId: myId, code }); } catch (e) {}
          setTimeout(() => { try { c.close(); } catch (e) {} }, 1200);
        });
        c.on('error', () => {});
      } catch (e) {}
    }
  }
  async function takeover() {
    if (S.mode !== 'client' || !S.net.backup || S.net.takingOver) return;
    if (Date.now() < (S.net.takeoverCooldown || 0)) return;
    const data = S.net.backup;
    if (!data || Date.now() - (data.at || 0) > 60000) return;
    S.net.takingOver = true;
    setNetBanner('房主离线，正在接管房间…');
    let peer = null;
    let myId = null;
    let claimedOld = false;
    try {
      try { peer = await openPeerAsync('mj-' + data.code, 8000); myId = 'mj-' + data.code; claimedOld = true; }
      catch (e) { peer = null; }
      if (!peer) {
        for (let i = 0; i < 3 && !peer; i++) {
          const id = 'mj-' + data.code + '-b' + randStr(4);
          try { peer = await openPeerAsync(id, 8000); myId = id; }
          catch (e) { await sleep(500); }
        }
      }
      if (!peer) throw new Error('无法建立信令连接');
      const g = Object.create(MJ.Game.prototype);
      Object.assign(g, data.raw);
      if (data.raw.uid) MJ.setUid(data.raw.uid);
      let mySeat = data.seats.findIndex(s => s && s.token === S.net.token);
      if (mySeat < 0) mySeat = 0;
      S.game = g;
      S.mode = 'host';
      S.net.isHost = true;
      S.seat = mySeat;
      S.seq = -1;
      S.lastSeq = -1;
      S.lastSeqAt = Date.now();
      S.room = {
        code: data.code, cfg: data.cfg, hostSeat: mySeat, started: true,
        seats: data.seats.map((s, i) => s ? {
          seat: i, name: s.name, token: s.token, peerId: s.peerId,
          connected: i === mySeat, ready: true, isAI: !!s.isAI, conn: null
        } : null)
      };
      if (g.players[mySeat]) { g.players[mySeat].online = true; g.players[mySeat].auto = false; }
      S.net.peer = peer;
      S.net.hostId = myId;
      S.net.connected = true;
      S.net.conn = null;
      S.net.connecting = false;
      peer.on('connection', conn => hostAccept(conn));
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
      peer.on('error', err => { if (err.type !== 'peer-unavailable') setNetBanner('网络：' + errText(err)); });
      S.net.backup = null;
      S.net.takingOver = false;
      S.net.takeoverCooldown = 0;
      store.set('mj_session', { code: data.code, token: S.net.token, seat: mySeat, hostId: myId, at: Date.now() });
      store.set('mj_hostid_' + data.code, myId);
      showScreen('table');
      pushState(true);
      setNetBanner('');
      toast(claimedOld ? '已接管房间，对局继续' : '已接管房间，正在通知其他玩家');
      if (!claimedOld) {
        notifyPeers(peer, data.code, myId, data, mySeat);
        let n = 0;
        const t = setInterval(() => {
          if (S.mode !== 'host' || n++ >= 3) { clearInterval(t); return; }
          notifyPeers(peer, data.code, myId, data, mySeat);
        }, 2500);
      }
    } catch (e) {
      if (peer) { try { peer.destroy(); } catch (e2) {} }
      S.net.takingOver = false;
      S.net.takeoverCooldown = Date.now() + 5000;
      setNetBanner('接管失败，继续重连…');
    }
  }
  function leaveToHome(silent) {
    if (!silent && S.mode && (S.screen === 'table' || S.screen === 'lobby')) {
      if (!confirm('确定退出当前对局？')) return;
    }
    clearTimeout(S.net.retry);
    try { S.net.conn && S.net.conn.send({ t: 'bye' }); } catch (e) {}
    try { S.net.conn && S.net.conn.close(); } catch (e) {}
    if (S.net.peer) { try { S.net.peer.destroy(); } catch (e) {} }
    const wasHost = S.mode === 'host';

    S.mode = null;
    S.game = null;
    S.room = null;
    S.lobby = null;
    S.view = null;
    S.seq = -1;
    S.net.conn = null;
    S.net.peer = null;
    S.net.connected = false;
    S.net.code = '';
    S.net.hostId = '';
    S.net.backup = null;
    S.net.takingOver = false;
    S.ui.sel = null;

      store.del('mj_host_last');

  /* ---------------- 操作 ---------------- */
  function sendIntent(a) {
    if (!a) return;
    S.net.intents++;
    if (S.mode === 'host' || S.mode === 'solo') {
      if (!S.game) return;
      if (S.game.phase === 'end') return toast('本局已结束');
      const ok = S.game.apply(S.seat, a);
      jrn('local', { seat: S.seat, a: a, ok: ok });
      if (!ok) toast('操作无效或已超时');
      S.ui.sel = null;
      pushState(true);
    } else if (S.mode === 'client') {
      if (!S.net.conn || !S.net.connected) return toast('连接中断，正在重连');
      const v = S.view;
      const o = v && v.me && v.me.options;
      if (o) {
        if (a.a === 'discard' && o.act !== 'turn') return;
        if ((a.a === 'peng' || a.a === 'gang' || a.a === 'hu' || a.a === 'pass') && o.act !== 'claim') return;
        if (a.a === 'zihu' && !(v.selfOptions && v.selfOptions.hu)) return;
        if ((a.a === 'angang' || a.a === 'bugang') && !(v.selfOptions && v.selfOptions.gangs.some(g => g.t === a.t))) return;
        if (a.a === 'think' && !(o.act === 'turn' && v.me.canThink)) return;
      }
      try { S.net.conn.send({ t: 'intent', a }); } catch (e) { return toast('发送失败'); }
      S.ui.sel = null;
      S.ui.botBusyUntil = Date.now() + 700;
    }
  }
  function onHandClick(uid) {
    const v = S.view;
    if (!v) return;
    const o = v.me.options;
    if (o.canSwap) {
      const t = v.me.hand.find(x => x.uid === uid);
      if (!t) return;
      const idx = S.ui.swap.indexOf(uid);
      if (idx >= 0) S.ui.swap.splice(idx, 1);
      else {
        if (S.ui.swap.length >= 3) return toast('最多选择三张');
        if (S.ui.swap.length) {
          const first = v.me.hand.find(x => x.uid === S.ui.swap[0]);
          if (first && Math.floor(first.t / 9) !== Math.floor(t.t / 9)) return toast('三张需同一花色');
        }
        S.ui.swap.push(uid);
      }
      renderTable();
      renderPrompt(v);
      return;
    }
    if (o.act !== 'turn' || !o.self || !o.self.discard) {
      if (S.ui.sel) { S.ui.sel = null; renderTable(); }
      return;
    }
    if (S.ui.sel === uid) {
      S.ui.sel = null;
      renderTable();
      renderActions(v);
    } else {
      S.ui.sel = uid;
      renderTable();
      renderActions(v);
    }
  }
  function pickGang() {
    const v = S.view;
    if (!v || !v.selfOptions) return;
    const gangs = v.selfOptions.gangs || [];
    if (!gangs.length) return;
    if (gangs.length === 1) {
      const g = gangs[0];
      return sendIntent({ a: g.kind === 'an' ? 'angang' : 'bugang', t: g.t });
    }
    openModal(`<div class="modal-card"><h3>选择杠牌</h3><div class="sub">暗杠 / 补杠</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${gangs.map(g =>

  }

  /* ---------------- 渲染 ---------------- */
  function applyView(v, serverNow) {
    if (!v) return;

    if (S.ui.sel) {
      const exists = v.me.hand && v.me.hand.some(t => t.uid === S.ui.sel);
      if (!exists) S.ui.sel = null;
    }
    renderTable();
    renderActions(v);
    renderPrompt(v);
    handleResult(v);
    handleActionToast(v);
    updateTimers();
    if (S.bot) setTimeout(botTick, 120);
    if (S.bot) botBusy = Math.max(botBusy, Date.now() + 260);
  }
  function seatOf(v, sea) { return v.players.find(p => p.seat === sea); }

  function meldsHTML(melds, hideAn) {

  function oppHandHTML(p, pos) {

    }

    if (pos === 'left' || pos === 'right') inner = new Array(n + 1).join(backTpl());

    return `<div class="op-hand">${inner}</div>`;
  }
  function riverHTML(p) {
    if (!p) return '';

  }
  function renderTable() {

    else if (v.phase === 'play' && v.claim) line = `<b>${esc(seatOf(v, v.claim.from) ? seatOf(v, v.claim.from).name : '')}</b> 打出 ${MJ.tileName(v.claim.tile.t)} · 等待响应`;
    else if (v.phase === 'play' && v.current >= 0) {

  }
  function handHTML(v) {
    const hand = (v.me.hand || []).slice();

      const i = hand.findIndex(x => x.uid === drawnUid);
      if (i >= 0) drawn = hand.splice(i, 1)[0];
    }
    MJ.sortTiles(hand);
    const list = drawn ? hand.concat([drawn]) : hand;
    const canSwap = v.me.options.canSwap;
    return list.map((t, idx) => {
      const isDrawn = drawn && t.uid === drawn.uid;
      const sel = S.ui.sel === t.uid || S.ui.swap.indexOf(t.uid) >= 0;
      const que = v.me.que != null && Math.floor(t.t / 9) === v.me.que;
      let cls = (sel ? 'sel ' : '') + (isDrawn ? 'drawn' : '');
      if (canSwap && S.ui.swap.length && S.ui.swap.indexOf(t.uid) < 0) {
        const first = v.me.hand.find(x => x.uid === S.ui.swap[0]);

      }

  function renderActions(v) {
    const bar = $('#actionBar');

    if (o.act === 'claim') {

        else if (a === 'peng') btn.push('<button class="act peng" data-act="peng">碰</button>');

      deadline = v.turnDeadline || 0;

      if (so.hu) btn.push('<button class="act hu" data-act="zihu">胡</button>');
      if (so.gangs && so.gangs.length) btn.push('<button class="act gang" data-act="gangpick">杠</button>');
      const thinking = v.longThinkSeat === S.seat;
      if (thinking) {
        btn.push(`<span class="act-hint">长考中 · 本局剩余 ${v.me.thinkLeft} 次</span>`);
      } else if (v.me.thinkLeft > 0) {
        btn.push(`<span class="act-hint">${S.ui.sel ? '已选牌 · 点击右侧出牌' : '请选牌'} · 20s 后自动长考（剩 ${v.me.thinkLeft} 次）</span>`);
      } else {
        btn.push(`<span class="act-hint">${S.ui.sel ? '已选牌 · 点击右侧出牌' : '请选牌'} · 长考次数已用完</span>`);
      }
    } else if (v.phase === 'end') {
      if (S.mode === 'host' || S.mode === 'solo') {

        btn.push('<button class="act act-leave" data-act="leave">退出</button>');

    }
    if (!btn.length) {
      bar.innerHTML = '';
      bar.classList.remove('on');

    const left = deadline ? Math.max(0, Math.ceil((deadline - (Date.now() - S.clockSkew)) / 1000)) : 0;
    bar.innerHTML = btn.join('') +
      (deadline ? `<div class="timer ${left <= 3 ? 'urgent' : ''}" data-deadline="${deadline}"><b>${left}</b>s</div>` : '');

  function renderPrompt(v) {
    const p = $('#centerPrompt');

      p.innerHTML = `<div class="cp-title">定缺</div>
        <div class="cp-sub">请选择要打缺的花色</div>

          `<button class="que-btn s${s}" data-que="${s}"><span class="suit">${SUITS[s]}</span><em>${c[s]}</em></button>`).join('')}
        </div>

      p.classList.add('on');
      if (pane) pane.classList.add('prompting');

      p.innerHTML = `<div class="cp-title">换三张</div>

  function swapDirText(d) { return d === 1 ? '逆时针 ' : (d === 3 ? '顺时针 ' : '对家 '); }
  function handleResult(v) {
    if (v.phase === 'end' && v.result) {
      if (S.ui.resultAt === v.result.at) return;
      S.ui.resultAt = v.result.at;
      recordHistory(v.result);
      renderActions(v);
    } else if (v.phase !== 'end' && S.ui.resultAt) {
      S.ui.resultAt = 0;
      if (S.ui.modal === 'result') closeModal();

  function recordHistory(r) {
    if (!r || !r.players) return;
    if (S.history.some(h => h.at === r.at)) return;
    const rows = r.players.map(p => ({
      seat: p.seat, name: p.name, delta: p.delta, chips: p.chips, hued: !!p.hued
    }));
    S.history.unshift({ at: r.at, handNo: r.handNo, reason: r.reason || '', rows: rows });
    if (S.history.length > 40) S.history.pop();
    if (S.mode !== 'client') store.set('mj_hist_' + (S.room ? S.room.code : ''), S.history);
    renderHistory();
  }
  function renderHistory() {
    const el = $('#historyPanel');
    if (!el) return;
    const last = S.history[0];
    const sum = last
      ? '第' + last.handNo + '局 ' + last.rows.map(x =>
        x.name + (x.delta > 0 ? '+' : '') + x.delta).join(' · ')
      : '本局结束后自动记录';
    el.classList.toggle('open', !!S.histOpen);
    el.innerHTML = `<button class="hist-head" id="histToggle">
        <span class="hist-title">积分记录${S.history.length ? ' ' + S.history.length : ''}</span>

      </button>
      <div class="hist-body">${S.history.length ? S.history.map(h => `
        <div class="hist-round">
          <div class="hist-rhead"><b>第 ${h.handNo} 局</b><span>${esc(h.reason)}</span></div>
          <div class="hist-nums">${h.rows.map(x => {
            const cls = x.delta > 0 ? 'pos' : x.delta < 0 ? 'neg' : 'zero';
            return `<span>${esc(x.name)}<b class="${cls}">${x.delta > 0 ? '+' : ''}${x.delta}</b><i>${x.chips}</i></span>`;
          }).join('')}</div>
        </div>`).join('') : '<div class="muted" style="font-size:10px;padding:4px">暂无记录</div>'}</div>`;
  }
  function renderResult(r) {
    const canNext = S.mode === 'host' || S.mode === 'solo';
    const rows = r.players.map(p => {
      const hu = (p.huInfo && p.huInfo.length)
        ? p.huInfo.map(h => `${h.zimo ? '自摸' : '胡'} ${h.patterns.map(x => x.name).join(' ')} · ${h.fan}番 ${h.score}分`).join('<br>')
        : (p.hued ? '' : '未胡');
      return `<tr><td>${esc(p.name)}</td><td class="num ${p.delta > 0 ? 'pos' : p.delta < 0 ? 'neg' : ''}">${p.delta > 0 ? '+' : ''}${p.delta}</td><td class="small">${hu}</td></tr>`;
    }).join('');
    const extras = (r.extra || []).length
      ? `<div class="res-extra">${r.extra.map(e => `${esc(nameOf(r, e.seat))} ${e.type}${e.to != null ? ' → ' + esc(nameOf(r, e.to)) : ''} -${e.amount}`).join(' · ')}</div>` : '';
    const chips = r.players.map(p => `<span>${esc(p.name)}<b>${p.chips}</b></span>`).join('');
    openModal(`<div class="modal-card result">
      <div class="res-head"><h3>第 ${r.handNo} 局结束</h3><span>${esc(r.reason || '')}</span></div>
      <table class="res-table"><thead><tr><th>玩家</th><th>得分</th><th>牌型</th></tr></thead><tbody>${rows}</tbody></table>
      ${extras}
      <div class="res-chips">${chips}</div>
      <div class="modal-actions">
        ${canNext ? '<button class="btn primary" id="btnNextHand">下一局</button>' : '<span class="muted" style="font-size:11px;align-self:center">等待房主开始下一局…</span>'}
        <button class="btn ghost" id="btnResLeave">退出</button>
      </div>
    </div>`, { kind: 'result' });
  }
  function nameOf(r, seat) {
    const p = r.players.find(x => x.seat === seat);
    return p ? p.name : ('玩家' + (seat + 1));
  }
  function handleActionToast(v) {
    if (!v.lastAction) return;
    if (v.seq === S.ui.lastActSeq) return;
    S.ui.lastActSeq = v.seq;
    const a = v.lastAction;
    if (a.type === 'discard') Snd.tile(a.tile.t);
    else if (a.type === 'peng') {
      toast(`${nameOfView(v, a.seat)} 碰 ${MJ.tileName(a.tile.t)}`, 1500);
      Snd.say('碰', a.tile.t);
    } else if (a.type === 'gang') {
      toast(`${nameOfView(v, a.seat)} ${a.gangKind === 'an' ? '暗杠' : a.gangKind === 'bu' ? '补杠' : '杠'} ${MJ.tileName(a.tile.t)}`, 1500);
      Snd.say('杠', a.tile.t);
    } else if (a.type === 'hu') {
      if (S.ui.huSeq === v.seq) return;
      S.ui.huSeq = v.seq;
      Snd.fan();
      Snd.say('胡');
      showHuBanner(a);
    }
  }
  function nameOfView(v, seat) {
    const p = v.players.find(x => x.seat === seat);
    return p ? p.name : ('玩家' + (seat + 1));
  }
  function showHuBanner(a) {
    const el = $('#huBanner');
    el.innerHTML = `<div class="big">胡</div><div class="sub">${(a.patterns || []).map(p => p.name).join(' · ')} · ${a.fan} 番 · ${a.score} 分</div>`;
    el.classList.add('on');
    clearTimeout(S.ui.huTimer);
    S.ui.huTimer = setTimeout(() => el.classList.remove('on'), 2600);
  }
  function updateTimers() {
    const now = Date.now() - S.clockSkew;
    $$('[data-deadline]').forEach(el => {
      const d = Number(el.dataset.deadline || 0);
      if (!d) return;
      const left = Math.max(0, Math.ceil((d - now) / 1000));
      const b = el.querySelector('b');
      if (b) b.textContent = left;
      else el.textContent = left + 's';
      if (left <= 3) el.classList.add('urgent');
      else el.classList.remove('urgent');
    });
  }

  /* ---------------- 机器人（测试 / 托管演示） ---------------- */
  let botBusy = 0;
  function botTick() {
    if (!S.bot || S.mode === 'host' && !S.room) return;
    if (S.screen === 'lobby' && S.mode === 'client' && S.lobby) {
      const me = S.lobby.seats[S.seat];
      if (me && !me.ready && !S.lobby.started) sendRaw({ t: 'ready', v: true });
      return;
    }
    if (S.screen !== 'table' || !S.view) return;
    if (Date.now() < botBusy) return;
    const v = S.view;
    if (v.phase === 'end') return;
    const o = v.me && v.me.options;
    if (!o) return;
    S.net.botTries++;
    botBusy = Date.now() + 450;
    if (o.canQue) {
      const c = [0, 0, 0];
      v.me.hand.forEach(x => { c[Math.floor(x.t / 9)]++; });
      let s = 0;
      for (let i = 1; i < 3; i++) if (c[i] < c[s]) s = i;
      return sendIntent({ a: 'que', s });
    }
    if (o.canSwap) {
      const by = [[], [], []];
      v.me.hand.forEach(x => by[Math.floor(x.t / 9)].push(x));
      let bi = 0;
      for (let i = 1; i < 3; i++) if (by[i].length > by[bi].length) bi = i;
      const arr = by[bi].slice(0, 3);
      if (arr.length === 3) return sendIntent({ a: 'swap', tiles: arr.map(x => x.uid) });
    }
    if (o.act === 'claim') {
      if (o.claim.indexOf('hu') >= 0) return sendIntent({ a: 'hu' });
      if (o.claim.indexOf('gang') >= 0 && Math.random() < .6) return sendIntent({ a: 'gang' });
      if (o.claim.indexOf('peng') >= 0 && Math.random() < .5) return sendIntent({ a: 'peng' });
      return sendIntent({ a: 'pass' });
    }
    if (o.act === 'turn') {
      const so = v.selfOptions || {};
      if (so.hu) return sendIntent({ a: 'zihu' });
      if (so.gangs && so.gangs.length && Math.random() < .35) {
        const g = so.gangs[0];
        return sendIntent({ a: g.kind === 'an' ? 'angang' : 'bugang', t: g.t });
      }
      const pseudo = { hand: v.me.hand, melds: v.me.melds, que: v.me.que };
      const t = MJ.AI.discard(pseudo);
      if (t) return sendIntent({ a: 'discard', uid: t.uid });
    }
  }
  function sendRaw(msg) {
    if (S.mode === 'host' || S.mode === 'solo') return;
    if (S.net.conn && S.net.connected) { try { S.net.conn.send(msg); } catch (e) {} }
  }

  /* ---------------- 循环 ---------------- */
  function hostLoop() {
    if (!S.game || (S.mode !== 'host' && S.mode !== 'solo') || !S.room) return;
    const now = Date.now();
    let changed = false;
    const beforeSeq = S.game.seq;
    const beforeHands = S.game.players.map(p => p.hand.length);
    try { changed = S.game.tick(now); } catch (e) { console.error(e); }
    if (S.game.seq !== beforeSeq) {
      jrn('tick', { beforeHands: beforeHands, a: S.game.lastAction });
    }
    if (S.game.phase === 'play' && !S.game.claim) {
      const g = S.game;
      for (const p of g.players) {
        if (g.cfg.mode === 'xuezhan' && p.hued) continue;
        const total = p.hand.length + p.melds.length * 3;
        const exp = g.current === p.seat ? 14 : 13;
        if (total !== exp) {
          S.anomalies.push({
            at: Date.now(), seat: p.seat, total, exp, cur: g.current,
            wall: g.wallLeft(), drawn: !!g.drawn, last: g.lastAction, log: g.log.slice(-5)
          });
          if (S.anomalies.length > 6) S.anomalies.shift();
          break;
        }
      }
    }
    if (S.game.seq !== S.lastSeq) {
      S.lastSeq = S.game.seq;
      S.lastSeqAt = now;
    } else if (S.game.phase === 'play' || S.game.phase === 'que' || S.game.phase === 'swap') {
      const pend = S.game.claim ? S.game.claim.deadline
        : (S.game.phase === 'play' ? S.game.turnDeadline : S.game.phaseDeadline);
      if (now - (S.lastSeqAt || now) > 25000 && (!pend || now > pend + 5000)) {
        S.lastSeqAt = now;
        try {
          S.game.forceProgress();
          changed = true;
          console.warn('forceProgress', S.game.phase, S.game.current, S.game.players.map(p => p.hand.length + ':' + p.melds.length));
        } catch (e) { console.error(e); }
      }
    }
    if (changed || now - S.lastPush > 1400) pushState();
    if (S.game.phase === 'end' && S.game.result && now - S.game.result.at > 90000) {
      nextHand();
    }
  }
  function backupLoop() {
    if (S.mode !== 'client') return;
    if (!S.net.backup) return;
    if (S.net.takingOver) return;
    if (Date.now() - S.lastMsg > 18000) takeover();
  }
  function watchdog() {
    if (S.mode !== 'client' || !S.lastMsg) return;
    if (S.screen !== 'table' && S.screen !== 'lobby') return;
    const silent = Date.now() - S.lastMsg;
    if (silent < 6000) return;
    setNetBanner('连接异常，正在重连…');
    if (silent > 8000 && Date.now() - (S.net.lastForce || 0) > 6000) {
      S.net.lastForce = Date.now();
      S.net.connected = false;
      S.net.connecting = false;
      try { S.net.conn && S.net.conn.close(); } catch (e) {}
      scheduleRetry();
    }
  }

  /* ---------------- 初始化 ---------------- */
  let layoutLocked = false;
  function syncLayout() {
    const w = window.innerWidth, h = window.innerHeight;
    const root = document.documentElement;
    const portrait = h >= w;
    const sw = portrait ? w : Math.min(w, Math.max(360, Math.round(h * .66)));
    const sh = h;
    const stage = $('#stage');
    if (stage) { stage.style.width = sw + 'px'; stage.style.height = sh + 'px'; }
    root.style.setProperty('--vw', sw + 'px');
    root.style.setProperty('--vh', sh + 'px');
    const handW = Math.max(200, sw - 74);
    let tw = Math.floor((handW - 12) / 7);
    tw = Math.max(26, Math.min(50, tw));
    if (sh < 660) tw = Math.min(tw, 42);
    if (sh < 560) tw = Math.min(tw, 38);
    if (sh < 480) tw = Math.min(tw, 34);
    if (sh < 420) tw = Math.min(tw, 30);
    root.style.setProperty('--tw', tw + 'px');
    root.classList.add('portrait');
    root.classList.toggle('short', sh < 620);
    root.classList.toggle('shorter', sh < 460);
    root.classList.toggle('wide', false);
    setTimeout(fitRivers, 30);
  }
  function fitRivers() {
    const fit = (el, max) => {
      if (!el) return;
      const n = el.children.length;
      if (!n) { el.style.removeProperty('--rvw'); el.style.removeProperty('--rvh'); return; }
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h) return;
      const cs = getComputedStyle(el);
      const cw = w - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      const ch = h - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
      if (cw <= 0 || ch <= 0) return;
      let best = 0;
      for (let c = 1; c <= n; c++) {
        const rows = Math.ceil(n / c);
        const tw = Math.floor((cw - (c - 1)) / c) - 1;
        const th = Math.floor((ch - (rows - 1)) / rows) - 1;
        const t = Math.min(tw, Math.floor(th / 1.36), max || 22);
        if (t > best) best = t;
      }
      const t = Math.max(7, best);
      el.style.setProperty('--rvw', t + 'px');
      el.style.setProperty('--rvh', Math.round(t * 1.36) + 'px');
    };
    fit($('#riverTop'), 20);
    fit($('#riverBottom'), 20);
    fit($('#riverLeft'), 22);
    fit($('#riverRight'), 22);
  }
  function init() {
    syncLayout();
    window.addEventListener('resize', () => { if (!layoutLocked) syncLayout(); });
    window.addEventListener('orientationchange', () => setTimeout(syncLayout, 220));
    document.addEventListener('focusin', e => {
      if (/INPUT|TEXTAREA/.test(e.target.tagName)) layoutLocked = true;
    });
    document.addEventListener('focusout', () => {
      layoutLocked = false;
      setTimeout(syncLayout, 260);
    });
    const nm = S.name || QS.get('name') || '';
    if (nm) { $('#nameInput').value = nm; S.name = nm; }
    renderCfgLine();
    renderResume();
    renderHistory();
    soundLabel();
    Snd.pickVoice();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.addEventListener) {
      speechSynthesis.addEventListener('voiceschanged', () => Snd.pickVoice());
    }
    $('#netDot').textContent = 'P2P 就绪';

    $('#nameInput').addEventListener('change', () => {
      const v = ($('#nameInput').value || '').trim();
      if (v) { S.name = v.slice(0, 8); store.set('mj_name', S.name); }
    });
    $('#btnSolo').onclick = () => { getName(); startSolo(); };
    $('#btnCreate').onclick = () => { getName(); createRoom(); };
    $('#btnJoinMode').onclick = () => {
      const row = $('#joinRow');
      row.classList.toggle('on');
      if (row.classList.contains('on')) $('#codeInput').focus();
    };
    $('#btnJoin').onclick = () => { getName(); joinRoom($('#codeInput').value); };
    $('#btnRules').onclick = openRules;
    $('#btnSettings').onclick = openSettings;
    $('#codeInput').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    });
    $('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') { getName(); joinRoom($('#codeInput').value); } });
    $('#btnCopyLink').onclick = () => copyInvite();
    $('#btnLobbyBack').onclick = () => leaveToHome();
    $('#btnLobbyCfg').onclick = openSettings;
    $('#btnReady').onclick = () => {
      const me = S.lobby && S.lobby.seats[S.seat];
      sendRaw({ t: 'ready', v: !(me && me.ready) });
    };
    $('#btnStart').onclick = () => startHostGame();
    $('#btnMenu').onclick = openMenu;
    $('#btnSound').onclick = () => {
      S.sound = !S.sound;
      store.set('mj_sound', S.sound);
      soundLabel();
      Snd.unlock();
      if (S.sound) Snd.say('音效已开启');
    };
    $('#btnDiscard').addEventListener('click', () => {
      if (!S.ui.sel) return toast('请先选择一张牌');
      const uid = S.ui.sel;
      S.ui.sel = null;
      sendIntent({ a: 'discard', uid });
    });
    $('#historyPanel').addEventListener('click', e => {
      if (!e.target.closest('#histToggle')) return;
      S.histOpen = !S.histOpen;
      renderHistory();
    });
    document.addEventListener('pointerdown', () => Snd.unlock(), { once: true });
    $('#myHand').addEventListener('click', e => {
      const el = e.target.closest('.tile');
      if (!el || el.dataset.uid == null) return;
      onHandClick(Number(el.dataset.uid));
    });
    $('#actionBar').addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'pass' || act === 'peng' || act === 'hu') sendIntent({ a: act });
      else if (act === 'gang') sendIntent({ a: 'gang' });
      else if (act === 'zihu') sendIntent({ a: 'zihu' });
      else if (act === 'discard') {
        if (!S.ui.sel) return toast('请先选择一张牌');
        const uid = S.ui.sel;
        S.ui.sel = null;
        sendIntent({ a: 'discard', uid });
      } else if (act === 'gangpick') pickGang();
      else if (act === 'think') sendIntent({ a: 'think' });
      else if (act === 'next') nextHand();
      else if (act === 'leave') leaveToHome();
    });
    $('#centerPrompt').addEventListener('click', e => {
      const q = e.target.closest('[data-que]');
      if (q) return sendIntent({ a: 'que', s: Number(q.dataset.que) });
      if (e.target.closest('#btnSwap')) {
        if (S.ui.swap.length !== 3) return toast('请选择三张同花色');
        const tiles = S.ui.swap.slice();
        S.ui.swap = [];
        sendIntent({ a: 'swap', tiles });
      }
    });
    $('#modalRoot').addEventListener('click', e => {
      if (e.target === $('#modalRoot')) {
        if (S.ui.modal === 'result') return;
        return closeModal();
      }
      const close = e.target.closest('[data-close]');
      if (close) return closeModal();
      const gang = e.target.closest('[data-gang-t]');
      if (gang) {
        const t = Number(gang.dataset.gangT);
        const kind = gang.dataset.gangKind;
        closeModal();
        return sendIntent({ a: kind === 'an' ? 'angang' : 'bugang', t });
      }
      const seg = e.target.closest('[data-seg-key]');
      if (seg && S.ui.cfgDraft) {
        const k = seg.dataset.segKey;
        let v = seg.dataset.segVal;
        if (['base', 'cap', 'chips'].indexOf(k) >= 0) v = Number(v);
        S.ui.cfgDraft[k] = v;
        renderSettings();
        return;
      }
      const tog = e.target.closest('[data-toggle-key]');
      if (tog && S.ui.cfgDraft) {
        const k = tog.dataset.toggleKey;
        S.ui.cfgDraft[k] = !S.ui.cfgDraft[k];
        renderSettings();
        return;
      }
      if (e.target.closest('#btnSaveCfg')) {
        S.cfg = Object.assign({}, DEFAULT_CFG, S.ui.cfgDraft);
        store.set('mj_cfg', S.cfg);
        renderCfgLine();
        if (S.room && (S.mode === 'host' || S.mode === 'solo') && !S.room.started) {
          S.room.cfg = Object.assign({}, S.cfg);
          pushLobby();
        }
        closeModal();
        toast('设置已保存');
        return;
      }
      if (e.target.closest('#btnNextHand')) { closeModal(); nextHand(); return; }
      if (e.target.closest('#btnResLeave')) { leaveToHome(true); return; }
      const m = e.target.closest('[data-menu]');
      if (m) {
        const a = m.dataset.menu;
        if (a === 'resume') closeModal();
        else if (a === 'rules') openRules();
        else if (a === 'copy') { copyInvite(); closeModal(); }
        else if (a === 'leave') { closeModal(); leaveToHome(); }
        return;
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (S.ui.modal && S.ui.modal !== 'result') closeModal();
        else if (S.ui.sel) { S.ui.sel = null; renderTable(); renderActions(S.view); }
      }
    });
    window.addEventListener('beforeunload', () => {
      try { S.net.conn && S.net.conn.send({ t: 'bye' }); } catch (e) {}
      try { S.net.peer && S.net.peer.destroy(); } catch (e) {}
    });

    setInterval(hostLoop, 120);
    setInterval(backupLoop, 1000);
    setInterval(watchdog, 2000);
    setInterval(updateTimers, 200);
    setInterval(botTick, 450);

    const qJoin = QS.get('room') || QS.get('join');
    if (qJoin) $('#codeInput').value = qJoin.toUpperCase();
    setTimeout(() => {
      if (QS.get('solo')) { getName(); startSolo(); }
      else if (QS.get('host')) { getName(); createRoom(); }
      else if (qJoin) { getName(); joinRoom(qJoin); }
      else {
        const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
        const isReload = nav && nav.type === 'reload';
        const hs = store.get('mj_host_last', null);
        if (isReload && hs && Date.now() - (hs.at || 0) < 10 * 60 * 1000 && store.get('mj_host_' + hs.code, null)) {
          getName();
          toast('正在恢复房间 ' + hs.code);
          restoreHost(hs.code);
          return;
        }
        const sn = store.get('mj_session', null);
        if (sn && Date.now() - (sn.at || 0) < 20 * 60 * 1000) {
          S.autoResume = true;
          getName();
          toast('正在恢复房间 ' + sn.code);
          joinRoom(sn.code, sn.hostId);
        }
      }
    }, 350);
  }

  function copyInvite() {
    const code = S.room ? S.room.code : (S.net.code || '');
    const url = location.href.split('?')[0].split('#')[0] + '?room=' + code;
    const done = () => toast('邀请链接已复制');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => toast(url, 4000));
    } else {
      toast(url, 4000);
    }
  }

  init();
})();</script>
</body>
